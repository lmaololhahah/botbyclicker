<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Botby Clicker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* =============================================================================
   DESIGN TOKENS — light, clean classroom palette
   ============================================================================= */
:root{
  --bg-deep:#faf8f4;
  --bg-deep-2:#f1eee6;
  --bg-panel:#ffffff;
  --bg-panel-2:#f5f2ec;
  --bg-panel-3:#ece7dc;
  --gold:#ffb703;
  --gold-soft:#f2b93d;
  --gold-dim:#c07f0a;
  --coral:#ff5d6c;
  --coral-dim:#e0384a;
  --teal:#12d6a0;
  --teal-dim:#0a9770;
  --blue:#4cc9f0;
  --blue-dim:#2a94b8;
  --purple:#b185f5;
  --purple-dim:#8257c9;
  --pink:#ff8fc7;
  --pink-dim:#e05fa0;
  --cream:#ffffff;
  --ink:#2b2118;
  --line:rgba(43,33,24,0.13);
  --shadow:rgba(30,20,10,0.14);
  --chalkboard:#2e4a3c;
  --chalkboard-dark:#182a21;
  --wood:#e6d3ae;
  --wood-dark:#cdae7c;
  --bg-photo:none;
  --font-display:'Fredoka', sans-serif;
  --font-hand:'Fredoka', sans-serif;
  --font-body:'Nunito', sans-serif;
  --font-num:'Space Grotesk', monospace;
}

*{box-sizing:border-box;}
html,body{
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--bg-deep);
  font-family:var(--font-body);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
::selection{background:var(--coral);color:#fff;}

*{scrollbar-width:thin;scrollbar-color:var(--gold-dim) transparent;}
*::-webkit-scrollbar{width:9px;height:9px;}
*::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:6px;}
*::-webkit-scrollbar-track{background:transparent;}

.hidden{display:none !important;}

/* =============================================================================
   APP SHELL
   ============================================================================= */
#app{
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  position:relative;
  background:
    radial-gradient(circle at 100% 0%, rgba(18,214,160,0.08), transparent 38%),
    radial-gradient(circle at 90% 85%, rgba(177,133,245,0.07), transparent 42%),
    radial-gradient(circle at 5% 90%, rgba(255,143,199,0.06), transparent 38%),
    linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-deep-2) 100%);
  transition:background .2s ease;
}
/* When a local background.jpg is found, it replaces the decorative
   gradients above with the photo plus a light scrim for readability. */
#app.has-bg-photo{
  background-image:
    linear-gradient(180deg, rgba(255,255,255,0.72), rgba(255,255,255,0.86)),
    var(--bg-photo);
  background-size:auto, cover;
  background-position:0 0, center;
  background-repeat:no-repeat, no-repeat;
  background-attachment:fixed, fixed;
}
/* subtle grain overlay for a more tactile, hand-made feel */
#app::after{
  content:"";
  position:fixed;inset:0;pointer-events:none;z-index:5;
  background-image:radial-gradient(rgba(0,0,0,0.02) 1px, transparent 1px);
  background-size:3px 3px;
  mix-blend-mode:multiply;
}

/* =============================================================================
   HEADER
   ============================================================================= */
header{
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:1rem;
  padding:0.6rem 1.4rem 0.9rem;
  border-bottom:2px dashed var(--line);
}
.brand h1{
  font-family:var(--font-display);
  font-weight:700;
  font-size:1.7rem;
  margin:0;
  color:var(--gold-dim);
  letter-spacing:0.01em;
  display:inline-block;
}
.header-stats{display:flex;flex-direction:column;align-items:center;line-height:1.05;}
#statPoints{
  font-family:var(--font-num);
  font-weight:700;
  font-size:2rem;
  color:var(--ink);
}
#statCurrencyLabel{
  font-size:0.75rem;
  color:var(--gold-dim);
  text-transform:uppercase;
  letter-spacing:0.12em;
  font-weight:700;
}
#statPerSecond{font-family:var(--font-num);font-size:0.85rem;color:var(--teal-dim);margin-top:0.1rem;font-weight:600;}

/* =============================================================================
   MAIN LAYOUT
   ============================================================================= */
.main-layout{flex:1;min-height:0;display:flex;gap:0;}

.click-stage{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  padding:1rem;
  gap:0.9rem;
}
.click-stage-inner{position:relative;display:flex;flex-direction:column;align-items:center;}
#mainClickable{
  width:min(46vh, 50vw, 21rem);
  height:min(46vh, 50vw, 21rem);
  border-radius:50%;
  border:none;
  cursor:pointer;
  position:relative;
  background:radial-gradient(circle at 50% 40%, var(--chalkboard) 0%, var(--chalkboard-dark) 100%);
  box-shadow:
    0 0 0 0.6rem var(--wood),
    0 0 0 0.85rem var(--wood-dark),
    0 1.2rem 2.6rem var(--shadow),
    inset 0 -0.6rem 1.4rem rgba(0,0,0,0.45),
    inset 0 0.6rem 1.4rem rgba(255,255,255,0.05);
  transition:transform .1s ease;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
#mainClickable:hover{filter:brightness(1.08);}
#mainClickable.clicked{animation:clickBounce 0.15s ease-out;}
@keyframes clickBounce{
  0%{transform:scale(1);}
  50%{transform:scale(0.94);}
  100%{transform:scale(1);}
}
body.reduce-motion #mainClickable.clicked{animation:none;}
.botby-face{width:64%;height:64%;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4));}
.botby-face .window{animation:blink 4.2s ease-in-out infinite;}
.botby-face .flag-wave{transform-origin:150px 22px;animation:flagwave 2.4s ease-in-out infinite;}
body.reduce-motion .botby-face .window{animation:none;}
body.reduce-motion .botby-face .flag-wave{animation:none;}
@keyframes blink{
  0%,92%,100%{opacity:1;}
  95%{opacity:0.3;}
}
@keyframes flagwave{
  0%,100%{transform:rotate(0deg);}
  50%{transform:rotate(-8deg);}
}
img.custom-photo{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
}
#clickableDescription{max-width:24rem;text-align:center;font-size:0.95rem;font-family:var(--font-body);font-weight:600;color:var(--ink);opacity:0.75;margin:0;}
#floatLayer{position:absolute;inset:0;pointer-events:none;overflow:visible;}
.float-num{
  position:absolute;
  font-family:var(--font-display);
  font-weight:700;
  color:var(--gold-dim);
  text-shadow:0 2px 6px rgba(0,0,0,0.15);
  animation:floatUp 0.8s ease-out forwards;
}
@keyframes floatUp{
  0%{opacity:1; transform:translateY(0) scale(0.9);}
  100%{opacity:0; transform:translateY(-3.2rem) scale(1);}
}
body.reduce-motion .float-num{animation:floatUpReduced 0.8s ease-out forwards;}
@keyframes floatUpReduced{0%{opacity:1;}80%{opacity:1;}100%{opacity:0;}}

#eventBanner{
  max-width:26rem;
  text-align:center;
  font-size:0.85rem;
  font-weight:700;
  font-family:var(--font-body);
  color:var(--ink);
  background:var(--teal);
  padding:0.5rem 1rem;
  border-radius:999px;
  box-shadow:0 6px 16px var(--shadow);
  transition:opacity .2s ease, transform .2s ease;
}
#eventBanner.hidden{opacity:0;transform:translateY(-6px);}

/* ---- right: store / tabs panel ---- */
.side-panel{
  flex:none;
  width:26rem;
  max-width:42vw;
  border-left:2px dashed var(--line);
  background-color:var(--bg-panel);
  background-image:radial-gradient(rgba(0,0,0,0.045) 1px, transparent 1.4px);
  background-size:14px 14px;
  display:flex;
  flex-direction:column;
  min-height:0;
}
.tab-bar{flex:none;display:flex;border-bottom:1px solid var(--line);}
.tab-btn{
  flex:1;
  border:none;
  background:transparent;
  color:var(--ink);
  opacity:0.55;
  font-family:var(--font-display);
  font-weight:500;
  font-size:0.82rem;
  padding:0.75rem 0.3rem;
  cursor:pointer;
  border-bottom:2px solid transparent;
  transition:opacity .15s ease, border-color .15s ease, background .15s ease;
}
.tab-btn:hover{opacity:0.85;background:rgba(0,0,0,0.03);}
.tab-btn.active{opacity:1;color:var(--gold-dim);border-bottom-color:var(--coral);background:rgba(0,0,0,0.03);}
.tab-panel{display:none;flex-direction:column;min-height:0;flex:1;overflow-y:auto;padding:0.9rem;gap:0.7rem;}
.tab-panel.active{display:flex;}

.section-label{
  font-family:var(--font-display);
  font-size:0.9rem;
  font-weight:700;
  color:var(--gold-dim);
  margin:0.3rem 0 0.1rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

/* item cards (staff + upgrades) — straight, plain cards, no tape/rotation */
.item-card{
  display:flex;
  align-items:center;
  gap:0.7rem;
  width:100%;
  text-align:left;
  border:1px solid var(--line);
  background:var(--cream);
  border-radius:0.6rem;
  padding:0.6rem 0.7rem 0.6rem 0.85rem;
  color:var(--ink);
  cursor:pointer;
  position:relative;
  box-shadow:0 2px 6px var(--shadow);
  transition:transform .12s ease, box-shadow .2s ease, filter .2s ease;
  margin-top:0.35rem;
}
.item-card:not(.disabled-card):hover{
  transform:translateY(-2px);
  box-shadow:0 0 0 2px var(--gold), 0 8px 16px var(--shadow);
  filter:brightness(1.02);
}
.item-card:not(.disabled-card):active{transform:translateY(0) scale(0.98);filter:brightness(1.0);}
body.reduce-motion .item-card:not(.disabled-card):hover{transform:none;}
.item-card:disabled{opacity:0.5;cursor:not-allowed;filter:grayscale(0.35);}
.item-card.disabled-card{opacity:0.5;cursor:not-allowed;filter:grayscale(0.35);}

.item-thumb{
  width:2.7rem;height:2.7rem;
  border-radius:0.6rem;
  flex:none;
  background:var(--bg-panel-3);
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.item-thumb:has(img){padding:0;}
.item-thumb:not(:has(img)){padding:0.45rem;}
.item-thumb svg{width:100%;height:100%;display:block;animation:idleSway 3.6s ease-in-out infinite;}
body.reduce-motion .item-thumb svg{animation:none;}
@keyframes idleSway{
  0%,100%{transform:rotate(-3deg);}
  50%{transform:rotate(3deg);}
}
.thumb-upload-btn{
  position:absolute;bottom:-0.35rem;right:-0.35rem;
  width:1.4rem;height:1.4rem;border-radius:50%;
  border:1px solid var(--line);background:var(--bg-panel-3);color:var(--ink);
  font-size:0.65rem;display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;line-height:1;
}
.thumb-upload-btn:hover{background:var(--bg-panel-2);}
.thumb-remove-btn{
  position:absolute;top:-0.35rem;left:-0.35rem;
  width:1.4rem;height:1.4rem;border-radius:50%;
  border:1px solid var(--line);background:var(--coral);color:#fff;
  font-size:0.62rem;display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;line-height:1;font-weight:700;
}
.thumb-remove-btn:hover{background:var(--coral-dim);}

.item-body{flex:1;min-width:0;}
.item-name{font-family:var(--font-display);font-weight:600;font-size:0.9rem;margin:0 0 0.1rem;color:var(--coral-dim);}
.item-name.hand{font-family:var(--font-display);font-weight:600;font-size:0.95rem;margin:0 0 0.2rem;line-height:1.2;color:var(--ink);}
.item-card.staff,
.item-card.compact{padding-top:0.7rem;padding-bottom:0.7rem;align-items:center;}
.item-card.staff .item-thumb,
.item-card.compact .item-thumb{width:3.1rem;height:3.1rem;}
.item-desc{font-size:0.72rem;color:var(--ink);opacity:0.72;margin:0 0 0.25rem;line-height:1.3;}
.item-meta{font-family:var(--font-num);font-size:0.72rem;color:var(--teal-dim);margin:0;font-weight:600;}
.item-count-badge{
  position:absolute;top:-0.4rem;right:-0.4rem;
  background:var(--coral);color:#fff;
  font-family:var(--font-num);font-weight:700;font-size:0.72rem;
  min-width:1.5rem;height:1.5rem;border-radius:999px;
  display:flex;align-items:center;justify-content:center;
  border:2px solid var(--bg-panel);
}

/* ---- polaroid mini-cards (Minnen / memories) ---- */
.mini-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.2rem,1fr));gap:1rem;padding:0.4rem 0.2rem 1rem;}
.mini-card{
  position:relative;
  background:var(--cream);
  color:var(--ink);
  padding:0.5rem 0.5rem 1.1rem;
  border-radius:0.5rem;
  border:1px solid var(--line);
  box-shadow:0 4px 10px var(--shadow);
  transition:transform .15s ease;
}
.mini-card:hover{transform:translateY(-2px);}
.mini-card.locked{filter:grayscale(1) brightness(0.9);opacity:0.7;}
.mini-card .mini-icon{
  width:100%;aspect-ratio:1/1;border-radius:0.4rem;
  background:var(--bg-panel-2);
  display:flex;align-items:center;justify-content:center;
  padding:1rem;
}
.mini-card .mini-icon svg{width:100%;height:100%;}
.mini-card-name{font-family:var(--font-display);font-weight:600;font-size:0.82rem;margin-top:0.4rem;text-align:center;}
.mini-card-desc{font-size:0.65rem;text-align:center;opacity:0.7;margin-top:0.15rem;}

/* stats panel */
.stats-row{display:flex;justify-content:space-between;padding:0.5rem 0.2rem;border-bottom:1px dashed var(--line);font-size:0.85rem;}
.stats-row span:last-child{font-family:var(--font-num);color:var(--gold-dim);font-weight:600;}
.prestige-box{
  margin-top:0.8rem;padding:0.9rem;border-radius:0.8rem;
  background:linear-gradient(160deg, rgba(232,178,61,0.1), rgba(79,174,140,0.06));
  border:1px solid var(--line);
}
#prestigeInfo{font-size:0.8rem;opacity:0.85;margin:0 0 0.7rem;line-height:1.4;}
.btn-primary{
  font-family:var(--font-display);font-weight:600;font-size:0.85rem;
  border:none;border-radius:999px;padding:0.6rem 1.2rem;
  background:linear-gradient(120deg, var(--coral), var(--gold));
  color:#2b2118;cursor:pointer;box-shadow:0 6px 14px var(--shadow);
  transition:transform .1s ease, filter .15s ease;
}
.btn-primary:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-1px);}
.btn-primary:disabled{opacity:0.35;cursor:not-allowed;}

/* =============================================================================
   MEMORY TOAST
   ============================================================================= */
#achievementToast{
  position:fixed;right:1.2rem;bottom:1.2rem;
  display:flex;align-items:center;gap:0.7rem;
  background:linear-gradient(120deg, var(--bg-panel), var(--bg-panel-2));
  border:1px solid var(--gold);border-radius:0.9rem;padding:0.7rem 1rem;
  box-shadow:0 12px 26px var(--shadow);
  transform:translateY(1rem);opacity:0;
  transition:transform .3s ease, opacity .3s ease;
  z-index:60;
}
#achievementToast.show{animation:toastPop 0.55s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes toastPop{
  0%{transform:translateY(1.2rem) scale(0.9);opacity:0;}
  60%{transform:translateY(-0.2rem) scale(1.03);opacity:1;}
  100%{transform:translateY(0) scale(1);opacity:1;}
}
body.reduce-motion #achievementToast.show{animation:none;transform:translateY(0);opacity:1;}
#toastIconWrap{width:2.6rem;height:2.6rem;border-radius:0.5rem;background:var(--bg-panel-3);display:flex;align-items:center;justify-content:center;padding:0.4rem;flex:none;}
#toastIconWrap svg{width:100%;height:100%;}
.toast-label{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--gold-dim);font-weight:700;}
#toastName{font-family:var(--font-display);font-weight:600;color:var(--ink);font-size:1rem;}

/* =============================================================================
   RESPONSIVE
   ============================================================================= */
@media (max-width: 860px){
  .main-layout{flex-direction:column;}
  .side-panel{width:100%;max-width:100%;border-left:none;border-top:2px dashed var(--line);flex:1;}
  #mainClickable{width:min(30vh,60vw,14rem);height:min(30vh,60vw,14rem);}
  .click-stage{padding:0.5rem;}
}
@media (max-width: 480px){
  .brand h1{font-size:1.3rem;}
  #statPoints{font-size:1.4rem;}
}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <h1 id="gameTitle">Botby Clicker</h1>
    </div>
    <div class="header-stats">
      <span id="statPoints">0</span>
      <span id="statCurrencyLabel">Gul Wilma</span>
      <span id="statPerSecond">0/s</span>
    </div>
  </header>

  <div class="main-layout">

    <section class="click-stage">
      <div class="click-stage-inner">
        <button id="mainClickable" title> 
          <svg class="botby-face" viewBox="0 0 200 200" aria-hidden="true">
            <line x1="150" y1="20" x2="150" y2="58" stroke="var(--cream)" stroke-width="4" stroke-linecap="round"/>
            <path class="flag-wave" d="M150 22 L184 31 L150 42 Z" fill="var(--coral)"/>
            <path d="M18 92 L100 28 L182 92 Z" fill="none" stroke="var(--cream)" stroke-width="5" stroke-linejoin="round"/>
            <rect x="32" y="92" width="136" height="84" rx="6" fill="none" stroke="var(--cream)" stroke-width="5"/>
            <rect x="88" y="132" width="24" height="44" rx="3" fill="none" stroke="var(--cream)" stroke-width="4"/>
            <rect class="window" x="50" y="108" width="20" height="20" rx="3" fill="var(--gold)"/>
            <rect class="window" x="130" y="108" width="20" height="20" rx="3" fill="var(--gold)"/>
            <rect class="window" x="50" y="142" width="20" height="18" rx="3" fill="var(--gold)"/>
            <rect class="window" x="130" y="142" width="20" height="18" rx="3" fill="var(--gold)"/>
          </svg>
          <div id="floatLayer"></div>
        </button>
      </div>
      <p id="clickableDescription"></p>
      <div id="eventBanner" class="hidden"></div>
    </section>

    <aside class="side-panel">
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="store">Butik</button>
        <button class="tab-btn" data-tab="achievements">Minnen</button>
        <button class="tab-btn" data-tab="stats">Stats</button>
      </div>

      <div class="tab-panel active" id="panel-store">
        <div class="section-label">Personal</div>
        <div id="buildingList" style="display:flex;flex-direction:column;gap:0.5rem;"></div>
        <div class="section-label">Uppgraderingar</div>
        <div id="upgradeList" style="display:flex;flex-direction:column;gap:0.5rem;"></div>
      </div>

      <div class="tab-panel" id="panel-achievements">
        <div class="section-label" id="achievementsProgress">Minnen</div>
        <div id="achievementList" class="mini-card-grid"></div>
      </div>

      <div class="tab-panel" id="panel-stats">
        <div class="section-label">Stats</div>
        <div id="statsPanel"></div>
        <div class="prestige-box">
          <p id="prestigeInfo">mera Gul Wilma behövs för att låsa upp ett nytt läsår.</p>
          <button id="btnPrestige" class="btn-primary" disabled>Starta nytt läsår</button>
        </div>
      </div>
    </aside>

  </div>
</div>

<input type="file" id="fileUpgradePhoto" accept="image/*" class="hidden">

<div id="achievementToast" class="hidden">
  <div id="toastIconWrap"></div>
  <div>
    <div class="toast-label">Nytt minne</div>
    <div id="toastName">—</div>
  </div>
</div>

<script>
/* =============================================================================
   BOTBY CLICKER — game configuration
   Staff (the repeatable buys, like cursor/grandma in Cookie Clicker): `buildings`.
   One-time upgrades: `manualUpgrades` (exactly 11, in the given order).
   Memories (achievements): `manualAchievements` + the ones generated per staff member.
   Name/currency: `GAME_SETTINGS`. Icons: `ICONS`.
   ============================================================================= */

const GAME_SETTINGS = {
  gameTitle: "Botby Clicker",
  currencyNameSingular: "Gul Wilma",
  currencyNamePlural: "Gul Wilma",
  currencyAbbrev: "GW",
  prestigeCurrencyName: "Guldstjärnor",
  saveKey: "botbyClickerSave_v7",
  autosaveIntervalSec: 8,
  tickIntervalMs: 200,
};

const mainClickable = {
  name: "Botby",
  description: "Klicka på Botby för Gul Wilma",
  baseClickAmount: 1,
};

const ICON_COLORS = { gold: "#ffb703", coral: "#ff5d6c", teal: "#12d6a0", blue: "#4cc9f0", purple: "#b185f5", pink: "#ff8fc7", cream: "#faf3e0" };
const PALETTE = [ICON_COLORS.coral, ICON_COLORS.teal, ICON_COLORS.blue, ICON_COLORS.gold, ICON_COLORS.purple, ICON_COLORS.pink];

function generateStaffBoostUpgrades() {
  const generated = [];
  STAFF_BOOSTS.forEach((entry) => {
    const b = buildings.find((building) => building.id === entry.targetId);
    if (!b) return;
    entry.tiers.forEach((tier, idx) => {
      generated.push({
        id: `u_boost_${entry.targetId}_${idx + 1}`,
        name: tier.name,
        description: tier.description,
        cost: Math.round(b.baseCost * tier.costMult),
        icon: b.icon,
        color: b.color,
        photoStaffId: entry.targetId,
        effect: { type: "buildingMultiplier", targetId: entry.targetId, value: tier.value },
        unlock: { type: "buildingOwned", targetId: entry.targetId, value: tier.ownedReq },
      });
    });
  });
  return generated;
}

function fmtNumber(n) {
  if (n === null || n === undefined || isNaN(n)) return "0";
  const sign = n < 0 ? "-" : "";
  n = Math.abs(n);
  if (n < 1000) {
    return sign + (Number.isInteger(n) ? n.toString() : n.toFixed(1));
  }
  const suffixes = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc"];
  let tier = Math.floor(Math.log10(n) / 3);
  tier = Math.min(tier, suffixes.length - 1);
  const scaled = n / Math.pow(1000, tier);
  const formatted = scaled >= 100 ? scaled.toFixed(0) : scaled >= 10 ? scaled.toFixed(1) : scaled.toFixed(2);
  return sign + formatted + suffixes[tier];
}
function fmtRate(n) { return fmtNumber(n); }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function buildThumb(icon, color, extraClass) {
  const wrap = document.createElement("div");
  wrap.className = extraClass || "item-thumb";
  wrap.appendChild(renderIcon(icon, color));
  return wrap;
}

/* -----------------------------------------------------------------------
   LOCAL FILE PHOTOS — if the person drops image files in the same folder
   as this HTML file, they're picked up automatically:
     background.jpg     → the page's background photo
     clickerbutton.jpg  → the big circle you click
     vaida.jpg, tiina.jpg, oskar.jpg, kati.jpg, troels.jpg, chatgpt.jpg,
     guni.jpg, kent.jpg, tommi.jpg, maija.jpg, prisma.jpg, stig.jpg
                         → that staff member's card art in the Personal list
                           (also reused automatically for their two boost
                           upgrades in the Uppgraderingar list)
     pennor.jpg, rast.jpg, skrivtavla.jpg, pizza.jpg, brandövning.jpg,
     klassräsa.jpg, printer.jpg, hallpass.jpg, läxfri.jpg, provfri.jpg,
     prismaupgrade.jpg, vikarie.jpg, skolmat.jpg
                         → the 13 base upgrades' card art
   None of these are required — if a file isn't there, the game quietly
   falls back to the drawn icon / default look. A photo uploaded via the
   📷 button on an upgrade card always wins over its automatic file.
   ----------------------------------------------------------------------- */
const localAssets = { clickerbutton: null, background: null, staff: {}, upgrades: {} };

function tryLoadLocalImage(path) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => { console.log(`[Botby Clicker] found local image: ${path}`); resolve(path); };
    img.onerror = () => resolve(null);
    img.src = path;
  });
}

/* Filesystems disagree on whether "background.jpg" and "Background.JPG" are
   the same file, so try a few common casings before giving up on a name. */
function filenameCandidates(base, ext) {
  const capitalized = base.charAt(0).toUpperCase() + base.slice(1);
  return [
    `${base}.${ext}`,
    `${capitalized}.${ext}`,
    `${base}.${ext.toUpperCase()}`,
    `${base.toUpperCase()}.${ext.toUpperCase()}`,
  ];
}

async function tryLoadFirstAvailable(paths) {
  for (const path of paths) {
    const result = await tryLoadLocalImage(path);
    if (result) return result;
  }
  console.log(`[Botby Clicker] no local image found for: ${paths[0]} (fine if you don't have one)`);
  return null;
}

async function preloadLocalAssets() {
  const staffChecks = buildings.map((b) => {
    const base = b.id.slice(2);
    return tryLoadFirstAvailable(filenameCandidates(base, "jpg")).then((src) => { localAssets.staff[b.id] = src; });
  });
  const upgradeChecks = Object.entries(UPGRADE_LOCAL_PHOTOS).map(([upgradeId, base]) =>
    tryLoadFirstAvailable(filenameCandidates(base, "jpg")).then((src) => { localAssets.upgrades[upgradeId] = src; })
  );
  const otherChecks = [
    tryLoadFirstAvailable(filenameCandidates("clickerbutton", "jpg")).then((src) => { localAssets.clickerbutton = src; }),
    tryLoadFirstAvailable(filenameCandidates("background", "jpg")).then((src) => { localAssets.background = src; }),
  ];
  await Promise.all([...staffChecks, ...upgradeChecks, ...otherChecks]);
}

/* Applies the local background.jpg (if found) as the page's background
   photo, replacing the decorative gradient. A light scrim is layered
   over it so the dark text stays readable. */
function applyBackgroundPhoto() {
  const app = document.getElementById("app");
  if (localAssets.background) {
    app.style.setProperty("--bg-photo", `url("${localAssets.background}")`);
    app.classList.add("has-bg-photo");
  } else {
    app.classList.remove("has-bg-photo");
  }
}

const BUILDING_ACHIEVEMENT_MILESTONES = [1, 10, 25, 50, 100];

function generateBuildingAchievements() {
  const generated = [];
  buildings.forEach((b) => {
    BUILDING_ACHIEVEMENT_MILESTONES.forEach((milestone) => {
      generated.push({
        id: `auto_a_${b.id}_m${milestone}`,
        name: `${milestone} gånger med ${b.name}`,
        description: `Anställ ${b.name} ${milestone} gånger.`,
        icon: b.icon,
        color: b.color,
        requirement: { type: "buildingOwned", targetId: b.id, value: milestone },
      });
    });
  });
  return generated;
}

const allUpgrades = [...manualUpgrades, ...generateStaffBoostUpgrades()];
const achievements = [...manualAchievements, ...generateBuildingAchievements()];

const upgradeById = Object.fromEntries(allUpgrades.map((u) => [u.id, u]));
const buildingById = Object.fromEntries(buildings.map((b) => [b.id, b]));
const achievementById = Object.fromEntries(achievements.map((a) => [a.id, a]));

function freshState() {
  return {
    points: 0,
    totalPointsEarned: 0,
    totalClicks: 0,
    buildingsOwned: {},
    upgradesBought: {},
    achievementsUnlocked: {},
    bonds: 0,
    prestigeCount: 0,
    lastSaveTime: Date.now(),
    customImages: { upgrades: {} },
    createdAt: Date.now(),
  };
}

let state = freshState();
let pointsPerSecondCache = 0;

function buildingOwnedCount(id) { return state.buildingsOwned[id] || 0; }

function buildingCost(building) {
  const owned = buildingOwnedCount(building.id);
  return Math.ceil(building.baseCost * Math.pow(1.15, owned));
}

function upgradeGlobalProductionMultiplier() {
  let mult = 1;
  Object.keys(state.upgradesBought).forEach((id) => {
    const u = upgradeById[id];
    if (u && u.effect.type === "globalProductionMultiplier") mult *= u.effect.value;
  });
  return mult;
}

function upgradeBuildingMultiplier(buildingId) {
  let mult = 1;
  Object.keys(state.upgradesBought).forEach((id) => {
    const u = upgradeById[id];
    if (u && u.effect.type === "buildingMultiplier" && u.effect.targetId === buildingId) mult *= u.effect.value;
  });
  return mult;
}

function achievementRewardMultiplier(kind) {
  let mult = 1;
  Object.keys(state.achievementsUnlocked).forEach((id) => {
    const a = achievementById[id];
    if (a && a.reward && a.reward.type === kind) mult *= a.reward.value;
  });
  return mult;
}

/* Per-unit production for one member of staff, including their own boost
   upgrades — independent of how many are currently owned. This is what's
   shown in the store list so a staff member's rate is visible even before
   you've bought your first one. */
function buildingPerUnitProduction(building) {
  return building.baseProduction * upgradeBuildingMultiplier(building.id);
}

function buildingBaseProduction(building) {
  return buildingPerUnitProduction(building) * buildingOwnedCount(building.id);
}

function computePointsPerSecond() {
  let total = 0;
  buildings.forEach((b) => { total += buildingBaseProduction(b); });
  total *= upgradeGlobalProductionMultiplier();
  total *= achievementRewardMultiplier("globalProductionMultiplier");
  total *= 1 + state.bonds * 0.02;
  return total;
}

function computeClickValue() {
  let val = mainClickable.baseClickAmount;
  Object.keys(state.upgradesBought).forEach((id) => {
    const u = upgradeById[id];
    if (!u) return;
    if (u.effect.type === "clickFlatBonus") val += u.effect.value;
  });
  let mult = 1;
  Object.keys(state.upgradesBought).forEach((id) => {
    const u = upgradeById[id];
    if (u && u.effect.type === "clickMultiplier") mult *= u.effect.value;
  });
  mult *= achievementRewardMultiplier("clickMultiplier");
  mult *= 1 + state.bonds * 0.02;
  return val * mult;
}

function isBuildingUnlocked(building) { return state.totalPointsEarned >= (building.unlockAt || 0); }

function isUpgradeUnlocked(upgrade) {
  const u = upgrade.unlock;
  if (!u || u.type === "none") return true;
  if (u.type === "totalPoints") return state.totalPointsEarned >= u.value;
  if (u.type === "clicks") return state.totalClicks >= u.value;
  if (u.type === "buildingOwned") return buildingOwnedCount(u.targetId) >= u.value;
  return true;
}

function checkAchievementRequirement(req) {
  if (!req) return false;
  switch (req.type) {
    case "totalPoints": return state.totalPointsEarned >= req.value;
    case "clicks": return state.totalClicks >= req.value;
    case "upgradesBought": return Object.keys(state.upgradesBought).length >= req.value;
    case "prestigeCount": return state.prestigeCount >= req.value;
    case "buildingOwned":
      if (req.targetId) return buildingOwnedCount(req.targetId) >= req.value;
      return Object.values(state.buildingsOwned).reduce((a, b) => a + b, 0) >= req.value;
    default: return false;
  }
}

function addPoints(amount) {
  state.points += amount;
  state.totalPointsEarned += amount;
}

function doClick() {
  const val = computeClickValue();
  addPoints(val);
  state.totalClicks += 1;
  spawnFloatingNumber(val);
  bounceMainClickable();
  checkAchievements();
  renderTopStats();
}

function buyBuilding(id) {
  const b = buildingById[id];
  if (!b) return;
  const cost = buildingCost(b);
  if (state.points < cost) return;
  state.points -= cost;
  state.buildingsOwned[id] = buildingOwnedCount(id) + 1;
  checkAchievements();
  renderAll();
}

function buyUpgrade(id) {
  const u = upgradeById[id];
  if (!u || state.upgradesBought[id]) return;
  if (state.points < u.cost) return;
  state.points -= u.cost;
  state.upgradesBought[id] = true;
  checkAchievements();
  renderAll();
}

function checkAchievements() {
  let newlyUnlocked = null;
  achievements.forEach((a) => {
    if (state.achievementsUnlocked[a.id]) return;
    if (checkAchievementRequirement(a.requirement)) {
      state.achievementsUnlocked[a.id] = true;
      newlyUnlocked = a;
    }
  });
  if (newlyUnlocked) showAchievementToast(newlyUnlocked);
}

function bondsAvailableOnReset() {
  return Math.floor(Math.sqrt(Math.max(0, state.totalPointsEarned) / 1000000));
}

function doPrestige() {
  const gained = bondsAvailableOnReset();
  if (gained < 1) return;
  const keepCustomImages = state.customImages;
  const newBonds = state.bonds + gained;
  const newPrestigeCount = state.prestigeCount + 1;
  const keptAchievements = state.achievementsUnlocked;
  state = freshState();
  state.bonds = newBonds;
  state.prestigeCount = newPrestigeCount;
  state.achievementsUnlocked = keptAchievements;
  state.customImages = keepCustomImages;
  saveGame();
  renderAll();
}

function saveGame() {
  state.lastSaveTime = Date.now();
  try {
    localStorage.setItem(GAME_SETTINGS.saveKey, JSON.stringify(state));
  } catch (e) {
    console.warn("Save failed", e);
  }
}

function mergeLoadedCustomImages(loaded) {
  const merged = { upgrades: {} };
  merged.upgrades = Object.assign({}, (loaded.customImages && loaded.customImages.upgrades) || {});
  return merged;
}

function loadGame() {
  let raw;
  try { raw = localStorage.getItem(GAME_SETTINGS.saveKey); } catch (e) { raw = null; }
  if (!raw) return;
  try {
    const loaded = JSON.parse(raw);
    state = Object.assign(freshState(), loaded);
    state.buildingsOwned = loaded.buildingsOwned || {};
    state.upgradesBought = loaded.upgradesBought || {};
    state.achievementsUnlocked = loaded.achievementsUnlocked || {};
    state.customImages = mergeLoadedCustomImages(loaded);
    applyOfflineProgress(loaded.lastSaveTime);
  } catch (e) {
    console.warn("Save file was corrupt, starting fresh.", e);
    state = freshState();
  }
}

function applyOfflineProgress(lastSaveTime) {
  if (!lastSaveTime) return;
  const elapsedSec = clamp((Date.now() - lastSaveTime) / 1000, 0, 60 * 60 * 24 * 3);
  if (elapsedSec < 5) return;
  const pps = computePointsPerSecond();
  const OFFLINE_EFFICIENCY = 0.5;
  const earned = pps * elapsedSec * OFFLINE_EFFICIENCY;
  if (earned > 0) {
    addPoints(earned);
    pendingOfflineReport = { seconds: elapsedSec, earned };
  }
}

let pendingOfflineReport = null;

function resizeImageToDataURL(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Could not read file"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Could not load image"));
      img.onload = () => {
        let width = img.width;
        let height = img.height;
        if (width > height && width > maxDim) {
          height = Math.round(height * (maxDim / width));
          width = maxDim;
        } else if (height >= width && height > maxDim) {
          width = Math.round(width * (maxDim / height));
          height = maxDim;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

let pendingUpgradePhotoTarget = null;

function openUpgradePhotoPicker(id) {
  pendingUpgradePhotoTarget = id;
  document.getElementById("fileUpgradePhoto").click();
}

function removeUpgradePhoto(id, evt) {
  if (evt) evt.stopPropagation();
  delete state.customImages.upgrades[id];
  renderUpgrades();
  saveGame();
}

function setupCustomPhotos() {
  const fileUpgrade = document.getElementById("fileUpgradePhoto");
  fileUpgrade.addEventListener("change", async () => {
    const file = fileUpgrade.files[0];
    fileUpgrade.value = "";
    const targetId = pendingUpgradePhotoTarget;
    pendingUpgradePhotoTarget = null;
    if (!file || !targetId) return;
    try {
      state.customImages.upgrades[targetId] = await resizeImageToDataURL(file, 200, 0.8);
      renderUpgrades();
      saveGame();
    } catch (e) { alert("Kunde inte använda den bilden."); }
  });
}

function spawnFloatingNumber(value) {
  const layer = document.getElementById("floatLayer");
  if (!layer) return;
  const el = document.createElement("div");
  el.className = "float-num";
  el.textContent = "+" + fmtNumber(value);
  el.style.left = (30 + Math.random() * 40) + "%";
  el.style.top = (30 + Math.random() * 30) + "%";
  el.style.fontSize = "1.1rem";
  layer.appendChild(el);
  setTimeout(() => el.remove(), 850);
}

function bounceMainClickable() {
  const btn = document.getElementById("mainClickable");
  if (!btn) return;
  btn.classList.remove("clicked");
  // force reflow so the animation restarts even on rapid repeat clicks
  void btn.offsetWidth;
  btn.classList.add("clicked");
  setTimeout(() => { btn.classList.remove("clicked"); }, 160);
}

function flashEventBanner(text, durationSec) {
  const banner = document.getElementById("eventBanner");
  if (!banner) return;
  banner.textContent = text;
  banner.classList.remove("hidden");
  clearTimeout(banner._timeout);
  banner._timeout = setTimeout(hideEventBanner, (durationSec || 3.5) * 1000);
}
function hideEventBanner() {
  const banner = document.getElementById("eventBanner");
  if (banner) banner.classList.add("hidden");
}

let toastQueue = [];
let toastShowing = false;
function showAchievementToast(a) {
  toastQueue.push(a);
  if (!toastShowing) drainToastQueue();
}
function drainToastQueue() {
  if (toastQueue.length === 0) { toastShowing = false; return; }
  toastShowing = true;
  const a = toastQueue.shift();
  const toast = document.getElementById("achievementToast");
  const iconWrap = document.getElementById("toastIconWrap");
  const nameEl = document.getElementById("toastName");
  nameEl.textContent = a.name;
  iconWrap.innerHTML = "";
  iconWrap.appendChild(renderIcon(a.icon, a.color));
  toast.classList.remove("hidden");
  requestAnimationFrame(() => toast.classList.add("show"));
  setTimeout(() => {
    toast.classList.remove("show");
    setTimeout(() => { toast.classList.add("hidden"); drainToastQueue(); }, 350);
  }, 2600);
}

function renderTopStats() {
  document.getElementById("statPoints").textContent = fmtNumber(state.points);
  document.getElementById("statCurrencyLabel").textContent = GAME_SETTINGS.currencyNamePlural;
  pointsPerSecondCache = computePointsPerSecond();
  document.getElementById("statPerSecond").textContent = fmtRate(pointsPerSecondCache) + "/s";
}

function renderMainClickable() {
  document.getElementById("gameTitle").textContent = GAME_SETTINGS.gameTitle;
  document.title = GAME_SETTINGS.gameTitle;
  document.getElementById("clickableDescription").textContent = mainClickable.description;

  const btn = document.getElementById("mainClickable");
  const svgFace = btn.querySelector("svg.botby-face");
  let img = btn.querySelector("img.custom-photo");
  const photoSrc = localAssets.clickerbutton;
  if (photoSrc) {
    if (svgFace) svgFace.classList.add("hidden");
    if (!img) {
      img = document.createElement("img");
      img.className = "custom-photo";
      img.alt = "";
      btn.insertBefore(img, btn.firstChild);
    }
    img.src = photoSrc;
  } else {
    if (img) img.remove();
    if (svgFace) svgFace.classList.remove("hidden");
  }
}

function renderBuildings() {
  const list = document.getElementById("buildingList");
  list.innerHTML = "";
  const unlocked = buildings.filter(isBuildingUnlocked);
  if (unlocked.length === 0) {
    list.innerHTML = `<p class="item-desc">Tjäna lite ${GAME_SETTINGS.currencyNamePlural} för att anställa din första i personalen.</p>`;
    return;
  }
  unlocked.forEach((b) => {
    const owned = buildingOwnedCount(b.id);
    const cost = buildingCost(b);
    const affordable = state.points >= cost;

    const btn = document.createElement("button");
    btn.className = "item-card staff";
    btn.disabled = !affordable;
    btn.appendChild(buildStaffThumb(b));

    const body = document.createElement("div");
    body.className = "item-body";
    body.innerHTML = `
      <p class="item-name hand">${escapeHtml(b.name)}</p>
      <p class="item-meta">${fmtNumber(cost)} ${GAME_SETTINGS.currencyAbbrev} · +${fmtRate(buildingPerUnitProduction(b))}/s styck</p>
    `;
    btn.appendChild(body);

    const badge = document.createElement("span");
    badge.className = "item-count-badge";
    badge.textContent = owned;
    btn.appendChild(badge);

    btn.addEventListener("click", () => buyBuilding(b.id));
    list.appendChild(btn);
  });
}

function renderUpgrades() {
  const list = document.getElementById("upgradeList");
  list.innerHTML = "";
  const visible = allUpgrades.filter((u) => !state.upgradesBought[u.id] && isUpgradeUnlocked(u));
  if (visible.length === 0) {
    list.innerHTML = `<p class="item-desc">Inga uppgraderingar tillgängliga än.</p>`;
    return;
  }
  visible.forEach((u) => {
    const affordable = state.points >= u.cost;
    const card = document.createElement("div");
    card.className = "item-card compact" + (affordable ? "" : " disabled-card");
    card.setAttribute("role", "button");
    card.setAttribute("tabindex", "0");
    card.appendChild(buildUpgradeThumb(u));

    const body = document.createElement("div");
    body.className = "item-body";
    body.innerHTML = `
      <p class="item-name hand">${escapeHtml(u.name)}</p>
      <p class="item-meta">${fmtNumber(u.cost)} ${GAME_SETTINGS.currencyAbbrev}</p>
    `;
    card.appendChild(body);

    const activate = () => { if (state.points >= u.cost) buyUpgrade(u.id); };
    card.addEventListener("click", activate);
    card.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(); }
    });
    list.appendChild(card);
  });
}

function renderAchievements() {
  const list = document.getElementById("achievementList");
  list.innerHTML = "";
  const unlockedCount = Object.keys(state.achievementsUnlocked).length;
  document.getElementById("achievementsProgress").textContent = `Minnen (${unlockedCount} / ${achievements.length})`;
  achievements.forEach((a) => {
    const unlocked = !!state.achievementsUnlocked[a.id];
    const card = document.createElement("div");
    card.className = "mini-card" + (unlocked ? "" : " locked");
    const iconBox = document.createElement("div");
    iconBox.className = "mini-icon";
    iconBox.appendChild(renderIcon(a.icon, unlocked ? a.color : "#c7c0b2"));
    card.appendChild(iconBox);
    const name = document.createElement("div");
    name.className = "mini-card-name";
    name.textContent = unlocked ? a.name : "???";
    card.appendChild(name);
    const desc = document.createElement("div");
    desc.className = "mini-card-desc";
    desc.textContent = unlocked ? a.description : "Fortsätt spela för att låsa upp.";
    card.appendChild(desc);
    list.appendChild(card);
  });
}

function renderStats() {
  const panel = document.getElementById("statsPanel");
  const rows = [
    ["Gul Wilma totalt", fmtNumber(state.totalPointsEarned)],
    ["Antal klick", fmtNumber(state.totalClicks)],
    ["Personal", fmtNumber(Object.values(state.buildingsOwned).reduce((a,b)=>a+b,0))],
    ["Uppgraderingar köpta", fmtNumber(Object.keys(state.upgradesBought).length)],
    ["Minnen", `${Object.keys(state.achievementsUnlocked).length} / ${achievements.length}`],
    [GAME_SETTINGS.prestigeCurrencyName, fmtNumber(state.bonds)],
    ["Nya läsår", fmtNumber(state.prestigeCount)],
  ];
  panel.innerHTML = rows.map(([label, val]) =>
    `<div class="stats-row"><span>${label}</span><span>${val}</span></div>`
  ).join("");

  const gain = bondsAvailableOnReset();
  document.getElementById("prestigeInfo").textContent =
    gain > 0
      ? `Starta ett nytt läsår för ${gain} ${GAME_SETTINGS.prestigeCurrencyName}. Varje ger +2% på all Gul Wilma, permanent.`
      : `Tjäna mer Gul Wilma för att låsa upp ett nytt läsår. Varje ${GAME_SETTINGS.prestigeCurrencyName} ger +2% på all Gul Wilma, permanent.`;
  document.getElementById("btnPrestige").disabled = gain < 1;
}

function escapeHtml(str) {
  if (!str) return "";
  return str.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function renderAll() {
  renderTopStats();
  renderMainClickable();
  renderBuildings();
  renderUpgrades();
  renderAchievements();
  renderStats();
}

function setupTabs() {
  const buttons = document.querySelectorAll(".tab-btn");
  buttons.forEach((btn) => {
    btn.addEventListener("click", () => {
      buttons.forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      document.querySelectorAll(".tab-panel").forEach((p) => p.classList.remove("active"));
      document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
    });
  });
}

function setupClickHandler() {
  document.getElementById("mainClickable").addEventListener("click", doClick);
}

function setupPrestige() {
  document.getElementById("btnPrestige").addEventListener("click", () => {
    const gain = bondsAvailableOnReset();
    if (gain < 1) return;
    if (!confirm(`Starta ett nytt läsår för ${gain} ${GAME_SETTINGS.prestigeCurrencyName}? Minnen och egna bilder sparas.`)) return;
    doPrestige();
  });
}

function showOfflineReportIfAny() {
  if (!pendingOfflineReport) return;
  const { seconds, earned } = pendingOfflineReport;
  pendingOfflineReport = null;
  const mins = Math.round(seconds / 60);
  flashEventBanner(`Välkommen tillbaka! Botby tjänade ${fmtNumber(earned)} ${GAME_SETTINGS.currencyAbbrev} medan du var borta (${mins} min).`, 6);
}

function tick() {
  const dtSec = GAME_SETTINGS.tickIntervalMs / 1000;
  const pps = computePointsPerSecond();
  if (pps > 0) addPoints(pps * dtSec);
  checkAchievements();
  renderTopStats();
}

async function init() {
  loadGame();
  setupTabs();
  setupClickHandler();
  setupCustomPhotos();
  setupPrestige();
  await preloadLocalAssets();
  applyBackgroundPhoto();
  renderAll();
  showOfflineReportIfAny();

  setInterval(tick, GAME_SETTINGS.tickIntervalMs);
  setInterval(() => { renderBuildings(); renderUpgrades(); renderStats(); }, 1000);
  setInterval(saveGame, GAME_SETTINGS.autosaveIntervalSec * 1000);
  window.addEventListener("beforeunload", saveGame);
  document.addEventListener("visibilitychange", () => { if (document.hidden) saveGame(); });
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
