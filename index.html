<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#f3efe6;
  --bg-deep-2:#e9e3d4;
  --bg-panel:#fbf9f4;
  --bg-panel-2:#efeadd;
  --bg-panel-3:#e4ddcc;
  --gold:#ffb703;
  --gold-soft:#f2b93d;
  --gold-dim:#c07f0a;
  --coral:#ff5d6c;
  --coral-dim:#e0384a;
  --teal:#12d6a0;
  --teal-dim:#0a9770;
  --blue:#4cc9f0;
  --blue-dim:#2a94b8;
  --purple:#b185f5;
  --purple-dim:#8257c9;
  --pink:#ff8fc7;
  --pink-dim:#e05fa0;
  --cream:#fdfbf7;
  --ink:#2b2118;
  --line:rgba(43,33,24,0.15);
  --shadow:rgba(30,20,10,0.16);
  --chalkboard:#2e4a3c;
  --chalkboard-dark:#182a21;
  --wood:#e6d3ae;
  --wood-dark:#cdae7c;
  --bg-photo:none;
  --font-display:'Fredoka', sans-serif;
  --font-hand:'Fredoka', sans-serif;
  --font-body:'Nunito', sans-serif;
  --font-num:'Space Grotesk', monospace;
}
body.dark-mode{
  --bg-deep:#181a17;
  --bg-deep-2:#101210;
  --bg-panel:#1f221e;
  --bg-panel-2:#262a23;
  --bg-panel-3:#2e332a;
  --cream:#22251f;
  --ink:#efe9db;
  --line:rgba(239,233,219,0.14);
  --shadow:rgba(0,0,0,0.5);
  --wood:#4a3d27;
  --wood-dark:#332a1a;
}
*{box-sizing:border-box;}
html,body{
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--bg-deep);
  font-family:var(--font-body);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
::selection{background:var(--coral);color:#fff;}
*{scrollbar-width:thin;scrollbar-color:var(--gold-dim) transparent;}
*::-webkit-scrollbar{width:9px;height:9px;}
*::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:6px;}
*::-webkit-scrollbar-track{background:transparent;}
.hidden{display:none !important;}
#app{
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  position:relative;
  background:
    radial-gradient(circle at 100% 0%, rgba(18,214,160,0.10), transparent 38%),
    radial-gradient(circle at 90% 85%, rgba(177,133,245,0.09), transparent 42%),
    radial-gradient(circle at 5% 90%, rgba(255,143,199,0.08), transparent 38%),
    linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-deep-2) 100%);
  transition:background .2s ease;
}
#app.has-bg-photo{
  background-image: var(--bg-photo);
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  background-attachment:fixed;
}
body.dark-mode #app.has-bg-photo{
  background-image: var(--bg-photo);
}
.left-column{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  min-height:0;
}
header{
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:1rem;
  padding:0.6rem 1.4rem 0.9rem;
  border-bottom:2px dashed var(--line);
  background:linear-gradient(180deg, rgba(255,183,3,0.09), rgba(255,183,3,0) 85%);
  box-shadow:0 4px 14px rgba(30,20,10,0.05);
  position:relative;
  z-index:2;
}
.brand{display:flex;align-items:center;gap:0.7rem;}
.brand h1{
  font-family:var(--font-display);
  font-weight:700;
  font-size:1.7rem;
  margin:0;
  color:var(--gold-dim);
  letter-spacing:0.01em;
  display:inline-block;
}
#btnDarkMode{
  border:1px solid var(--line);
  background:var(--bg-panel-2);
  color:var(--ink);
  width:2.2rem;height:2.2rem;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  font-size:1rem;
  flex:none;
  transition:background .15s ease, transform .1s ease;
}
#btnDarkMode:hover{background:var(--bg-panel-3);}
#btnDarkMode:active{transform:scale(0.92);}
.header-stats{display:flex;flex-direction:column;align-items:center;line-height:1.05;user-select:none;-webkit-user-select:none;}
#statPoints{
  font-family:var(--font-num);
  font-weight:700;
  font-size:2rem;
  color:var(--ink);
  display:inline-block;
  transform-origin:center;
}
#statPoints.bump{animation:statPointsBump 0.4s ease-out;}
@keyframes statPointsBump{
  0%{transform:scale(1);}
  35%{transform:scale(1.16);}
  100%{transform:scale(1);}
}
body.reduce-motion #statPoints.bump{animation:none;}
#statCurrencyLabel{
  font-size:0.75rem;
  color:var(--gold-dim);
  text-transform:uppercase;
  letter-spacing:0.12em;
  font-weight:700;
}
#statPerSecond{font-family:var(--font-num);font-size:0.85rem;color:var(--ink);margin-top:0.1rem;font-weight:600;}
.main-layout{flex:1;min-height:0;display:flex;gap:0;}
.click-stage{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  padding:1rem;
  gap:0.9rem;
}
.click-stage-inner{position:relative;display:flex;flex-direction:column;align-items:center;}
#mainClickable{
  width:min(51vh, 55vw, 24rem);
  height:min(51vh, 55vw, 24rem);
  border-radius:50%;
  border:none;
  cursor:pointer;
  position:relative;
  background:radial-gradient(circle at 50% 40%, var(--chalkboard) 0%, var(--chalkboard-dark) 100%);
  box-shadow:
    0 0 0 0.6rem #ffffff,
    0 0 0 0.85rem #e8e8e8,
    0 0 0 1.1rem rgba(255,183,3,0.18),
    0 1.6rem 3.2rem var(--shadow),
    inset 0 -0.6rem 1.4rem rgba(0,0,0,0.45),
    inset 0 0.6rem 1.4rem rgba(255,255,255,0.05);
  transition:transform .1s ease;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
#mainClickable:hover{filter:brightness(1.08);}
#mainClickable.clicked{animation:clickBounce 0.15s ease-out;}
@keyframes clickBounce{
  0%{transform:scale(1);}
  50%{transform:scale(0.94);}
  100%{transform:scale(1);}
}
body.reduce-motion #mainClickable.clicked{animation:none;}
.botby-face{width:64%;height:64%;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4));}
.botby-face .window{animation:blink 4.2s ease-in-out infinite;}
.botby-face .flag-wave{transform-origin:150px 22px;animation:flagwave 2.4s ease-in-out infinite;}
body.reduce-motion .botby-face .window{animation:none;}
body.reduce-motion .botby-face .flag-wave{animation:none;}
@keyframes blink{
  0%,92%,100%{opacity:1;}
  95%{opacity:0.3;}
}
@keyframes flagwave{
  0%,100%{transform:rotate(0deg);}
  50%{transform:rotate(-8deg);}
}
img.custom-photo{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
}
#clickableDescription{max-width:24rem;text-align:center;font-size:0.95rem;font-family:var(--font-body);font-weight:600;color:var(--ink);opacity:0.75;margin:0;}
#floatLayer{position:absolute;inset:0;pointer-events:none;overflow:visible;}
.float-num{
  position:absolute;
  font-family:var(--font-display);
  font-weight:700;
  color:var(--gold-dim);
  text-shadow:0 2px 6px rgba(0,0,0,0.15);
  animation:floatUp 0.8s ease-out forwards;
  user-select:none;
  -webkit-user-select:none;
  --tilt:0deg;
}
@keyframes floatUp{
  0%{opacity:1; transform:translateY(0) scale(0.9) rotate(0deg);}
  100%{opacity:0; transform:translateY(-3.2rem) scale(1) rotate(var(--tilt));}
}
body.reduce-motion .float-num{animation:floatUpReduced 0.8s ease-out forwards;}
@keyframes floatUpReduced{0%{opacity:1;}80%{opacity:1;}100%{opacity:0;}}
#eventBanner{
  max-width:26rem;
  text-align:center;
  font-size:0.85rem;
  font-weight:700;
  font-family:var(--font-body);
  color:var(--ink);
  background:var(--teal);
  padding:0.5rem 1rem;
  border-radius:999px;
  box-shadow:0 6px 16px var(--shadow);
  transition:opacity .2s ease, transform .2s ease;
}
#eventBanner.hidden{opacity:0;transform:translateY(-6px);}
.side-panel{
  flex:none;
  width:26rem;
  max-width:42vw;
  border-left:2px dashed var(--line);
  background-color:var(--bg-panel);
  box-shadow:-10px 0 26px rgba(30,20,10,0.06);
  display:flex;
  flex-direction:column;
  min-height:0;
}
.tab-bar{flex:none;display:flex;border-bottom:1px solid var(--line);}
.tab-btn{
  flex:1;
  border:none;
  background:transparent;
  color:var(--ink);
  opacity:0.55;
  font-family:var(--font-display);
  font-weight:500;
  font-size:0.82rem;
  padding:0.75rem 0.3rem;
  cursor:pointer;
  border-bottom:2px solid transparent;
  transition:opacity .15s ease, border-color .15s ease, background .15s ease;
}
.tab-btn:hover{opacity:0.85;background:rgba(0,0,0,0.03);}
.tab-btn.active{opacity:1;color:var(--gold-dim);border-bottom-color:var(--coral);background:rgba(0,0,0,0.03);}
.tab-panel{display:none;flex-direction:column;min-height:0;flex:1;overflow-y:auto;padding:0.9rem;gap:0.7rem;}
.tab-panel.active{display:flex;}
.section-label{
  font-family:var(--font-display);
  font-size:0.9rem;
  font-weight:700;
  color:var(--gold-dim);
  margin:0.3rem 0 0.1rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.item-card{
  display:flex;
  align-items:center;
  gap:0.7rem;
  width:100%;
  text-align:left;
  border:1px solid var(--line);
  background:var(--cream);
  border-radius:0.6rem;
  padding:0.6rem 0.7rem 0.6rem 0.7rem;
  color:var(--ink);
  cursor:pointer;
  position:relative;
  box-shadow:0 2px 6px var(--shadow);
  transition:transform .12s ease, box-shadow .2s ease, filter .2s ease;
  margin-top:0.35rem;
}
.item-card:not(.disabled-card):hover{
  transform:translateY(-2px);
  box-shadow:0 0 0 2px var(--gold), 0 8px 16px var(--shadow);
  filter:brightness(1.02);
}
.item-card:not(.disabled-card):active{transform:translateY(0) scale(0.98);filter:brightness(1.0);}
body.reduce-motion .item-card:not(.disabled-card):hover{transform:none;}
.item-card:disabled{opacity:0.5;cursor:not-allowed;filter:grayscale(0.35);}
.item-card.disabled-card{opacity:0.5;cursor:not-allowed;filter:grayscale(0.35);}
.item-thumb{
  width:2.7rem;height:2.7rem;
  border-radius:0.6rem;
  flex:none;
  background:var(--bg-panel-3);
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.item-thumb:has(img){padding:0;}
.item-thumb:not(:has(img)){padding:0.45rem;}
.item-thumb svg{width:100%;height:100%;display:block;animation:idleSway 3.6s ease-in-out infinite;}
body.reduce-motion .item-thumb svg{animation:none;}
@keyframes idleSway{
  0%,100%{transform:rotate(-3deg);}
  50%{transform:rotate(3deg);}
}
.item-body{flex:1;min-width:0;}
.item-name{font-family:var(--font-display);font-weight:600;font-size:0.9rem;margin:0 0 0.1rem;color:var(--coral-dim);}
.item-name.hand{font-family:var(--font-display);font-weight:600;font-size:0.95rem;margin:0 0 0.2rem;line-height:1.2;color:var(--ink);}
.item-card.staff,
.item-card.compact{padding-top:0.7rem;padding-bottom:0.7rem;align-items:center;}
.item-card.staff .item-thumb,
.item-card.compact .item-thumb{width:3.1rem;height:3.1rem;}
.item-desc{font-size:0.72rem;color:var(--ink);opacity:0.72;margin:0 0 0.25rem;line-height:1.3;}
.item-meta{font-family:var(--font-num);font-size:0.72rem;color:var(--teal-dim);margin:0;font-weight:600;}
.item-count-badge{
  position:absolute;top:-0.4rem;right:-0.4rem;
  background:var(--coral);color:#fff;
  font-family:var(--font-num);font-weight:700;font-size:0.72rem;
  min-width:1.5rem;height:1.5rem;border-radius:999px;
  display:flex;align-items:center;justify-content:center;
  border:2px solid var(--bg-panel);
}
.mini-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.2rem,1fr));gap:1rem;padding:0.4rem 0.2rem 1rem;}
.mini-card{
  position:relative;
  background:var(--cream);
  color:var(--ink);
  padding:0.5rem 0.5rem 1.1rem;
  border-radius:0.5rem;
  border:1px solid var(--line);
  box-shadow:0 4px 10px var(--shadow);
  transition:transform .15s ease;
}
.mini-card:hover{transform:translateY(-2px);}
.mini-card.locked{filter:grayscale(1) brightness(0.9);opacity:0.7;}
.mini-card .mini-icon{
  width:100%;aspect-ratio:1/1;border-radius:0.4rem;
  background:var(--bg-panel-2);
  display:flex;align-items:center;justify-content:center;
  padding:1rem;
}
.mini-card .mini-icon svg{width:100%;height:100%;}
.mini-card-name{font-family:var(--font-display);font-weight:600;font-size:0.82rem;margin-top:0.4rem;text-align:center;}
.mini-card-desc{font-size:0.65rem;text-align:center;opacity:0.7;margin-top:0.15rem;}
.stats-row{display:flex;justify-content:space-between;padding:0.5rem 0.2rem;border-bottom:1px dashed var(--line);font-size:0.85rem;}
.stats-row span:last-child{font-family:var(--font-num);color:var(--gold-dim);font-weight:600;}
.prestige-box{
  margin-top:0.8rem;padding:0.9rem;border-radius:0.8rem;
  background:linear-gradient(160deg, rgba(232,178,61,0.1), rgba(79,174,140,0.06));
  border:1px solid var(--line);
}
#prestigeInfo{font-size:0.8rem;opacity:0.85;margin:0 0 0.7rem;line-height:1.4;}
.prestige-progress{position:relative;width:100%;height:1.1rem;border-radius:999px;background:var(--bg-panel-3);border:1px solid var(--line);overflow:hidden;margin:0 0 0.7rem;}
.prestige-progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));transition:width 0.3s ease;}
.prestige-progress-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:0.68rem;font-weight:600;color:var(--ink);}
.btn-primary{
  font-family:var(--font-display);font-weight:600;font-size:0.85rem;
  border:none;border-radius:0.6rem;padding:0.55rem 1.1rem;
  background:var(--gold);
  color:#2b2118;cursor:pointer;
  transition:filter .15s ease;
}
.btn-primary:hover:not(:disabled){filter:brightness(1.08);}
.btn-primary:disabled{opacity:0.35;cursor:not-allowed;}
.btn-danger{background:var(--coral-dim);color:#fff;}
.danger-box{
  margin-top:0.8rem;padding:0.9rem;border-radius:0.8rem;
  background:linear-gradient(160deg, rgba(224,56,74,0.1), rgba(224,56,74,0.04));
  border:1px solid var(--line);
}
.danger-box p{font-size:0.8rem;opacity:0.85;margin:0 0 0.7rem;line-height:1.4;}
.stats-subhead{
  font-family:var(--font-display);font-weight:600;font-size:0.8rem;
  color:var(--gold-dim);margin:0.9rem 0 0.2rem;text-transform:uppercase;letter-spacing:0.06em;
}
#infoText{
  flex:1;
  min-height:12rem;
  border:1px solid var(--line);
  border-radius:0.6rem;
  background:var(--cream);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:0.85rem;
  line-height:1.6;
  padding:0.7rem 0.8rem;
  box-shadow:0 2px 6px var(--shadow);
  white-space:pre-wrap;
}
.staff-stat-row{display:flex;justify-content:space-between;align-items:center;padding:0.35rem 0.2rem;border-bottom:1px dashed var(--line);font-size:0.8rem;gap:0.5rem;}
.staff-stat-row .ssr-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.staff-stat-row .ssr-owned{font-family:var(--font-num);color:var(--coral-dim);font-weight:600;flex:none;}
.staff-stat-row .ssr-rate{font-family:var(--font-num);color:var(--gold-dim);font-weight:600;flex:none;min-width:11rem;text-align:right;}
#customTooltip{
  position:fixed;
  z-index:120;
  max-width:19rem;
  min-width:11rem;
  background:var(--cream);
  border:2px solid var(--gold);
  border-radius:0.9rem;
  padding:0.85rem 1.05rem;
  box-shadow:0 14px 34px var(--shadow);
  font-family:var(--font-display);
  font-weight:600;
  font-size:1.05rem;
  line-height:1.35;
  color:var(--ink);
  pointer-events:none;
  opacity:0;
  white-space:pre-line;
  transform:translateY(4px) scale(0.98);
  transition:opacity .12s ease, transform .12s ease;
}
#customTooltip.show{opacity:1;transform:translateY(0) scale(1);}
body.reduce-motion #customTooltip{transition:opacity .12s ease;}
body.reduce-motion #customTooltip.show{transform:none;}
#achievementToast{
  position:fixed;right:1.2rem;bottom:1.2rem;
  display:flex;align-items:center;gap:0.7rem;
  background:linear-gradient(120deg, var(--bg-panel), var(--bg-panel-2));
  border:1px solid var(--gold);border-radius:0.9rem;padding:0.7rem 1rem;
  box-shadow:0 12px 26px var(--shadow);
  transform:translateY(1rem);opacity:0;
  transition:transform .3s ease, opacity .3s ease;
  z-index:60;
}
#achievementToast.show{animation:toastPop 0.55s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes toastPop{
  0%{transform:translateY(1.2rem) scale(0.9);opacity:0;}
  60%{transform:translateY(-0.2rem) scale(1.03);opacity:1;}
  100%{transform:translateY(0) scale(1);opacity:1;}
}
body.reduce-motion #achievementToast.show{animation:none;transform:translateY(0);opacity:1;}
#toastIconWrap{width:2.6rem;height:2.6rem;border-radius:0.5rem;background:var(--bg-panel-3);display:flex;align-items:center;justify-content:center;padding:0.4rem;flex:none;}
#toastIconWrap svg{width:100%;height:100%;}
.toast-label{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--gold-dim);font-weight:700;}
#toastName{font-family:var(--font-display);font-weight:600;color:var(--ink);font-size:1rem;}
@media (max-width: 860px){
  .main-layout{flex-direction:column;}
  .side-panel{width:100%;max-width:100%;border-left:none;border-top:2px dashed var(--line);flex:1;}
  #mainClickable{width:min(30vh,60vw,14rem);height:min(30vh,60vw,14rem);}
  .click-stage{padding:0.5rem;}
}
@media (max-width: 480px){
  .brand h1{font-size:1.3rem;}
  #statPoints{font-size:1.4rem;}
}
</style>
</head>
<body>
<div id="app">

  <div class="main-layout">

    <div class="left-column">
      <header>
        <div class="brand">
          <h1 id="gameTitle">Botby Clicker</h1>
          <button id="btnDarkMode" title="Mörkt läge">🌙</button>
        </div>
        <div class="header-stats">
          <span id="statPerSecond">0/s</span>
          <span id="statCurrencyLabel">Gul Wilma</span>
          <span id="statPoints">0</span>
        </div>
      </header>

      <section class="click-stage">
        <div class="click-stage-inner">
          <button id="mainClickable" title="Click på Botby">
            <svg class="botby-face" viewBox="0 0 200 200" aria-hidden="true">
              <line x1="150" y1="20" x2="150" y2="58" stroke="var(--cream)" stroke-width="4" stroke-linecap="round"/>
              <path class="flag-wave" d="M150 22 L184 31 L150 42 Z" fill="var(--coral)"/>
              <path d="M18 92 L100 28 L182 92 Z" fill="none" stroke="var(--cream)" stroke-width="5" stroke-linejoin="round"/>
              <rect x="32" y="92" width="136" height="84" rx="6" fill="none" stroke="var(--cream)" stroke-width="5"/>
              <rect x="88" y="132" width="24" height="44" rx="3" fill="none" stroke="var(--cream)" stroke-width="4"/>
              <rect class="window" x="50" y="108" width="20" height="20" rx="3" fill="var(--gold)"/>
              <rect class="window" x="130" y="108" width="20" height="20" rx="3" fill="var(--gold)"/>
              <rect class="window" x="50" y="142" width="20" height="18" rx="3" fill="var(--gold)"/>
              <rect class="window" x="130" y="142" width="20" height="18" rx="3" fill="var(--gold)"/>
            </svg>
            <div id="floatLayer"></div>
          </button>
        </div>
        <p id="clickableDescription">Click på Botby för Gul Wilma</p>
        <div id="eventBanner" class="hidden"></div>
      </section>
    </div>

    <aside class="side-panel">
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="store">Butik</button>

/* Upgrades kept clustering at identical or near-identical prices (several
   pairs landed on the exact same cost), which made the store feel flat.
   This re-spaces every base cost so consecutive prices (once sorted) are
   always at least MIN_COST_RATIO apart - ties get bumped up just enough
   to separate, anything already spaced further apart is left alone, so
   the overall curve keeps its original shape and just loses the flat
   spots. Runs on the base (pre-scale) costs, before UPGRADE_COST_SCALE
   is applied below, so scaling preserves the new spacing. */
const MIN_COST_RATIO = 1.18;
function dedupeAndSpaceCosts(list, minRatio) {
  const sorted = [...list].sort((a, b) => a.cost - b.cost || a.id.localeCompare(b.id));
  let prevCost = 0;
  sorted.forEach((u) => {
    const minAllowed = prevCost > 0 ? Math.ceil(prevCost * minRatio) : u.cost;
    u.cost = Math.max(u.cost, minAllowed);
    prevCost = u.cost;
  });
}
dedupeAndSpaceCosts(manualUpgrades, MIN_COST_RATIO);

const UPGRADE_BUILDING_UNLOCK_SCALE = 2;

  if (u.unlock.type === "totalPoints") {
    u.unlock.value = Math.round(u.unlock.value * UPGRADE_UNLOCK_SCALE);
  } else if (u.unlock.type === "buildingOwned") {
    u.unlock.value = Math.round(u.unlock.value * UPGRADE_BUILDING_UNLOCK_SCALE);
  }
});

function hashStr(str) {

function makeFollowUpUpgrade(u, { suffix, roman, costMult, clickMultValue, flatBonusMult, prodMultShare, followUps, unlockFrom }) {

  const followUp = pool ? pool[hashStr(u.id + suffix) % pool.length] : "";
  const baseName = u.name.replace(/ (I|II|III)$/, "");

function fmtNumber(n) {
  if (n === null || n === undefined || isNaN(n)) return "0";
  const sign = n < 0 ? "-" : "";
  n = Math.abs(n);
  if (n < 1000) {
    return sign + (Number.isInteger(n) ? n.toString() : n.toFixed(1));
  }
  const suffixes = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc"];
  let tier = Math.floor(Math.log10(n) / 3);
  tier = Math.min(tier, suffixes.length - 1);
  const scaled = n / Math.pow(1000, tier);
  const formatted = scaled >= 100 ? scaled.toFixed(0) : scaled >= 10 ? scaled.toFixed(1) : scaled.toFixed(2);
  return sign + formatted + suffixes[tier];
}
function fmtRate(n) { return fmtNumber(n); }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function fmtDuration(ms) {
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const days = Math.floor(totalSec / 86400);
  const hours = Math.floor((totalSec % 86400) / 3600);
  const mins = Math.floor((totalSec % 3600) / 60);
  const secs = totalSec % 60;
  if (days > 0) return `${days}d ${hours}h ${mins}m`;
  if (hours > 0) return `${hours}h ${mins}m`;
  if (mins > 0) return `${mins}m ${secs}s`;
  return `${secs}s`;
}
function fmtPercent(mult) {
  return (mult >= 1 ? "+" : "") + Math.round((mult - 1) * 100) + "%";
}
function fmtDate(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  const pad = (x) => String(x).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function tryLoadLocalImage(path) {

}

const IMAGE_EXTENSIONS = ["jpg", "jpeg", "png", "webp"];

function filenameCandidates(base, ext) {
  const capitalized = base.charAt(0).toUpperCase() + base.slice(1);
  return [
    `${base}.${ext}`,
    `${capitalized}.${ext}`,
    `${base}.${ext.toUpperCase()}`,
    `${base.toUpperCase()}.${ext.toUpperCase()}`,
  ];
}

function stripDiacritics(str) {
  return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/å/gi, "a").replace(/ä/gi, "a").replace(/ö/gi, "o");
}

function slugify(str) {
  return stripDiacritics(str).toLowerCase().replace(/[^a-z0-9]+/g, "");
}

/* Every upgrade automatically gets a photo slot - no need to hand-add an
   entry to UPGRADE_LOCAL_PHOTOS for new upgrades. If UPGRADE_LOCAL_PHOTOS
   has an explicit filename for this id (used for a few of the older
   upgrades with existing custom names), that's tried first. Either way,
   it also always tries the upgrade's id (without "u_") and a slugified
   version of its Swedish name, so a brand new upgrade just works once you
   drop in a file matching one of those - check the Bildfelsökning panel
   in Stats to see exactly which filenames it's trying for a given one. */
function upgradePhotoBases(u) {
  const explicit = UPGRADE_LOCAL_PHOTOS[u.id];
  const explicitList = explicit ? (Array.isArray(explicit) ? explicit : [explicit]) : [];
  const idBase = u.id.replace(/^u_/, "");
  const nameBase = slugify(u.name);
  const auto = [idBase, nameBase].filter((b, i, arr) => b && arr.indexOf(b) === i);
  return [...explicitList, ...auto];
}

/* Records every filename this attempted and whether one worked, keyed by
   whatever debugKey the caller passes in (e.g. "u_firedrill"). Shown on
   screen in the Stats tab so filename mismatches are visible without
   opening devtools. */
const imageLoadDebug = {};

async function tryLoadFirstAvailable(baseOrBases, debugKey) {
  const bases = Array.isArray(baseOrBases) ? baseOrBases : [baseOrBases];
  const allBases = [];
  bases.forEach((b) => {
    if (!allBases.includes(b)) allBases.push(b);
    const stripped = stripDiacritics(b);
    if (!allBases.includes(stripped)) allBases.push(stripped);
  });
  const tried = [];
  for (const base of allBases) {
    for (const ext of IMAGE_EXTENSIONS) {
      for (const path of filenameCandidates(base, ext)) {
        tried.push(path);
        const result = await tryLoadLocalImage(path);
        if (result) {
          if (debugKey) imageLoadDebug[debugKey] = { found: result, tried };
          return result;
        }
      }
    }
  }
  console.log(`[Botby Clicker] no local image found for: ${allBases[0]} (fine if you don't have one)`);
  if (debugKey) imageLoadDebug[debugKey] = { found: null, tried };
  return null;
}

function buildingOwnedCount(id) { return state.buildingsOwned[id] || 0; }

function buildingCost(building) {

  return Math.ceil(building.baseCost * Math.pow(1.19, owned));

/* Multiplicative upgrades compound fast - a handful of "+20% production"
   upgrades bought together can snowball into something way stronger
   than any single one felt like it should be. This softens the combined
   bonus once it passes +200% (i.e. the raw product goes above 3x):
   everything below that line behaves exactly as before, and only the
   excess above it grows slower, so no single upgrade purchase ever
   feels overpowered on its own, but a big pile of them still adds up
   over time - just more gently. */
function softenStackedBonus(rawMultiplier) {
  const bonus = rawMultiplier - 1;
  const softCap = 2; // +200% combined before softening kicks in
  if (bonus <= softCap) return rawMultiplier;
  return 1 + softCap + Math.pow(bonus - softCap, 0.65);
}

function upgradeGlobalProductionMultiplier() {
  let mult = 1;
  Object.keys(state.upgradesBought).forEach((id) => {
    const u = upgradeById[id];
    if (u && u.effect.type === "globalProductionMultiplier") mult *= u.effect.value;
  });
  return softenStackedBonus(mult);
}

function upgradeBuildingMultiplier(buildingId) {
  let mult = 1;
  Object.keys(state.upgradesBought).forEach((id) => {
    const u = upgradeById[id];
    if (u && u.effect.type === "buildingMultiplier" && u.effect.targetId === buildingId) mult *= u.effect.value;
  });
  return mult;
}

function achievementRewardMultiplier(kind) {
  let mult = 1;
  Object.keys(state.achievementsUnlocked).forEach((id) => {
    const a = achievementById[id];
    if (a && a.reward && a.reward.type === kind) mult *= a.reward.value;
  });
  return mult;
}

/* Every staff member gets stronger each time you buy another one — but
   the boost per purchase tapers off the more you own, so it never gets
   silly. The 1st copy gives roughly a 5% boost, and by ~200 owned each
   additional copy only adds about 0.2%. */
const GROWTH_RATE_MAX = 0.05;   // boost from the very first purchase
const GROWTH_RATE_MIN = 0.002;  // boost per purchase once you own a lot
const GROWTH_DECAY = 40;        // how quickly the boost tapers off

function buildingGrowthMultiplier(building) {
  const owned = buildingOwnedCount(building.id);
  let mult = 1;
  for (let n = 0; n < owned; n++) {
    const rate = GROWTH_RATE_MIN + (GROWTH_RATE_MAX - GROWTH_RATE_MIN) * Math.exp(-n / GROWTH_DECAY);
    mult *= 1 + rate;
  }
  return mult;
}

function buildingPerUnitProduction(building) {
  return building.baseProduction * upgradeBuildingMultiplier(building.id) * buildingGrowthMultiplier(building);
}

function buildingBaseProduction(building) {
  return buildingPerUnitProduction(building) * buildingOwnedCount(building.id);
}

/* The store used to show each staff member's per-unit rate WITHOUT the
   store's global "+X% produktion" upgrades, achievement production
   bonuses, or the prestige bonus factored in - so "Tommi does 200K/s"
   kept reading the same even after buying a pile of production
   upgrades that made every Tommi actually produce far more than that.
   This applies the same global multipliers computePointsPerSecond()
   uses (just not multiplied by owned count, since this is the per-unit
   figure), so the number shown always matches what that one staff
   member is really contributing right now. */
function buildingEffectivePerUnitProduction(building) {
  return (
    buildingPerUnitProduction(building) *
    upgradeGlobalProductionMultiplier() *
    achievementRewardMultiplier("globalProductionMultiplier") *
    (1 + state.bonds * PRESTIGE_BONUS_PER_UNIT)
  );
}

/* "How much of my per-second income does each staff member account
   for" - deliberately ignores every upgrade (both the per-building
   "X blir mera effektiv" boosts and the store's global "+X% produktion"
   upgrades), since those apply on top and would just make every
   building's share converge toward the same ratios its raw headcount
   already implies. This is purely: base rate x the automatic per-owned
   growth bonus x how many are hired - i.e. each person's own natural
   output, which is what the Stats tab's percentage breakdown (and the
   hover tooltip) uses. */
function buildingRawProduction(building) {
  return building.baseProduction * buildingGrowthMultiplier(building) * buildingOwnedCount(building.id);
}

/* Shared by the Stats tab breakdown and the hover tooltip so both always
   agree on the same number. Returns a ready-to-display string like
   "12% av total gul wilma produktion" or "<0.1% av total gul wilma
   produktion" - "0%" if nobody is hired anywhere yet. */
function buildingShareOfProductionText(building) {
  const owned = buildings.filter((b) => buildingOwnedCount(b.id) > 0);
  const totalRaw = owned.reduce((sum, b) => sum + buildingRawProduction(b), 0);
  if (totalRaw <= 0) return "0% av total gul wilma produktion";
  const share = (buildingRawProduction(building) / totalRaw) * 100;
  const shareText = share < 0.1 ? "<0.1%" : `${share.toFixed(share < 10 ? 1 : 0)}%`;
  return `${shareText} av total gul wilma produktion`;
}

function computePointsPerSecond() {
  let total = 0;
  buildings.forEach((b) => { total += buildingBaseProduction(b); });
  total *= upgradeGlobalProductionMultiplier();
  total *= achievementRewardMultiplier("globalProductionMultiplier");
  total *= 1 + state.bonds * PRESTIGE_BONUS_PER_UNIT;
  return total;
}

function computeClickValue() {
  let val = mainClickable.baseClickAmount;
  Object.keys(state.upgradesBought).forEach((id) => {
    const u = upgradeById[id];
    if (!u) return;
    if (u.effect.type === "clickFlatBonus") val += u.effect.value;
  });
  let mult = 1;
  Object.keys(state.upgradesBought).forEach((id) => {
    const u = upgradeById[id];
    if (u && u.effect.type === "clickMultiplier") mult *= u.effect.value;
  });
  mult = softenStackedBonus(mult);
  mult *= achievementRewardMultiplier("clickMultiplier");
  mult *= 1 + buildingOwnedCount("b_vaida") * VAIDA_CLICK_PER_OWNED;
  mult *= 1 + state.bonds * PRESTIGE_BONUS_PER_UNIT;
  return val * mult;
}

function isBuildingUnlocked(building) { return state.totalPointsEarned >= (building.unlockAt || 0); }

function isUpgradeUnlocked(upgrade) {
  const u = upgrade.unlock;
  if (!u || u.type === "none") return true;
  if (u.type === "totalPoints") return state.totalPointsEarned >= u.value;
  if (u.type === "clicks") return state.totalClicks >= u.value;
  if (u.type === "buildingOwned") return buildingOwnedCount(u.targetId) >= u.value;
  if (u.type === "upgradeBought") return !!state.upgradesBought[u.targetId];
  return true;
}

function checkAchievementRequirement(req) {
  if (!req) return false;
  switch (req.type) {
    case "totalPoints": return state.totalPointsEarned >= req.value;
    case "clicks": return state.totalClicks >= req.value;
    case "upgradesBought": return Object.keys(state.upgradesBought).length >= req.value;
    case "prestigeCount": return state.prestigeCount >= req.value;
    case "buildingOwned":
      if (req.targetId) return buildingOwnedCount(req.targetId) >= req.value;
      return Object.values(state.buildingsOwned).reduce((a, b) => a + b, 0) >= req.value;
    case "specificUpgrade": return !!state.upgradesBought[req.targetId];
    case "ownAllBuildings": return buildings.every((b) => buildingOwnedCount(b.id) > 0);
    case "playTime": return Date.now() - (state.createdAt || Date.now()) >= req.value;
    default: return false;
  }
}

function addPoints(amount) {
  state.points += amount;
  state.totalPointsEarned += amount;
}

/* Three small synthesized sound effects - no audio files needed, just
   quick blips through the Web Audio API. The context is created lazily
   on first use since browsers won't let audio start before a user
   gesture, and every one of these always follows a click, so that's
   never an issue. Each is shaped differently (waveform, pitch curve,
   and duration) so hiring, upgrading, and clicking Botby feel distinct
   from each other instead of one sound doing triple duty. */
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

/* Shared "click" helper used by all three effects below: a short burst
   of filtered noise (the "tick") plus a low thump underneath (the
   "body"), same physical-click character as clicking Botby itself -
   just with different filter pitch, thump weight, and duration per
   event so hiring, upgrading, and clicking Botby still feel distinct
   from each other. No musical tones anywhere - everything is a click. */
function playClickNoise(ctx, startTime, opts) {
  opts = opts || {};
  const duration = opts.duration || 0.022;
  const filterFreq = opts.filterFreq || 2100;
  const noisePeak = opts.noisePeak || 0.16;
  const thumpFreq = opts.thumpFreq || 160;
  const thumpPeak = opts.thumpPeak || 0.055;
  const thumpDuration = opts.thumpDuration || 0.03;

  const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * duration));
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
  }
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.value = filterFreq;
  filter.Q.value = 0.7;
  const noiseGain = ctx.createGain();
  noiseGain.gain.setValueAtTime(noisePeak, startTime);
  noiseGain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
  noise.connect(filter);
  filter.connect(noiseGain);
  noiseGain.connect(ctx.destination);
  noise.start(startTime);
  noise.stop(startTime + duration + 0.01);

  const thump = ctx.createOscillator();
  const thumpGain = ctx.createGain();
  thump.type = "sine";
  thump.frequency.setValueAtTime(thumpFreq, startTime);
  thumpGain.gain.setValueAtTime(0.0001, startTime);
  thumpGain.gain.exponentialRampToValueAtTime(thumpPeak, startTime + 0.002);
  thumpGain.gain.exponentialRampToValueAtTime(0.0001, startTime + thumpDuration);
  thump.connect(thumpGain);
  thumpGain.connect(ctx.destination);
  thump.start(startTime);
  thump.stop(startTime + thumpDuration + 0.005);
}

/* Clicking Botby: a light, quiet click - short enough to stay pleasant
   through a long clicking session instead of getting tiring. */
function playClickSound() {
  try {
    const ctx = getAudioCtx();
    playClickNoise(ctx, ctx.currentTime, {
      duration: 0.022, filterFreq: 2100, noisePeak: 0.16,
      thumpFreq: 160, thumpPeak: 0.055, thumpDuration: 0.03,
    });
  } catch (e) { /* audio not available - fine, just skip it */ }
}

/* Buying an upgrade: a quick double-click - sharper and higher-pitched
   than a plain click so it reads as "purchase confirmed" rather than
   the click on Botby itself. */
function playPopSound() {
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    playClickNoise(ctx, now, {
      duration: 0.02, filterFreq: 2800, noisePeak: 0.18,
      thumpFreq: 220, thumpPeak: 0.05, thumpDuration: 0.025,
    });
    playClickNoise(ctx, now + 0.045, {
      duration: 0.02, filterFreq: 3100, noisePeak: 0.16,
      thumpFreq: 260, thumpPeak: 0.045, thumpDuration: 0.025,
    });
  } catch (e) { /* audio not available - fine, just skip it */ }
}

/* Hiring personal: a quick triple-click, lower and a bit heavier than
   the upgrade sound - a bigger commitment gets a fuller click without
   turning into a musical chime. */
function playHireSound() {
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    [0, 0.045, 0.09].forEach((offset) => {
      playClickNoise(ctx, now + offset, {
        duration: 0.024, filterFreq: 1700, noisePeak: 0.19,
        thumpFreq: 130, thumpPeak: 0.08, thumpDuration: 0.035,
      });
    });
  } catch (e) { /* audio not available - fine, just skip it */ }
}

function doClick() {
  const val = computeClickValue();
  addPoints(val);
  state.totalClicks += 1;
  spawnFloatingNumber(val);
  bounceMainClickable();
  playClickSound();
  checkAchievements();
  renderTopStats();
}

function buyBuilding(id) {
  const b = buildingById[id];
  if (!b) return;
  const cost = buildingCost(b);
  if (state.points < cost) return;
  state.points -= cost;
  state.buildingsOwned[id] = buildingOwnedCount(id) + 1;
  playHireSound();
  checkAchievements();
  renderAll();
}

function buyUpgrade(id) {
  const u = upgradeById[id];
  if (!u || state.upgradesBought[id]) return;
  if (state.points < u.cost) return;
  state.points -= u.cost;
  state.upgradesBought[id] = true;
  playPopSound();
  checkAchievements();
  renderAll();
}

function checkAchievements() {
  let newlyUnlocked = null;
  achievements.forEach((a) => {
    if (state.achievementsUnlocked[a.id]) return;
    if (checkAchievementRequirement(a.requirement)) {
      state.achievementsUnlocked[a.id] = true;
      newlyUnlocked = a;
    }
  });
  if (newlyUnlocked) showAchievementToast(newlyUnlocked);
}

/* Prestige used to be reachable in a couple hours (1,000,000 total
   earned for the first star) and each star was worth +2% forever -
   both were way too generous. The threshold is now vastly higher
   (1,000,000,000,000 - a trillion - just for the first Nytt ämne), and
   it uses a cube root instead of a square root, so each additional one
   after that needs dramatically more too: the 2nd needs 8x the
   threshold, the 3rd needs 27x, and so on - climbing much slower than
   before. The payout per unit is also halved (1% instead of 2%), so
   even once you have a few, the permanent bonus stays reasonable. */
const PRESTIGE_THRESHOLD = 1000000000000; // 1 trillion Gul Wilma for the 1st Nytt ämne
const PRESTIGE_BONUS_PER_UNIT = 0.01; // +1% per Nytt ämne, was +2%

function bondsAvailableOnReset() {
  return Math.floor(Math.cbrt(Math.max(0, state.totalPointsEarned) / PRESTIGE_THRESHOLD));
}

/* How much more Gul Wilma is needed before the NEXT Nytt ämne kicks in
   (i.e. before bondsAvailableOnReset() ticks up by one more). */
function pointsNeededForNextBond() {
  const currentGain = bondsAvailableOnReset();
  const nextThreshold = Math.pow(currentGain + 1, 3) * PRESTIGE_THRESHOLD;
  return Math.max(0, nextThreshold - state.totalPointsEarned);
}

function doPrestige() {
  const gained = bondsAvailableOnReset();
  if (gained < 1) return;
  const newBonds = state.bonds + gained;
  const newPrestigeCount = state.prestigeCount + 1;
  const keptAchievements = state.achievementsUnlocked;
  state = freshState();
  state.bonds = newBonds;
  state.prestigeCount = newPrestigeCount;
  state.achievementsUnlocked = keptAchievements;
  saveGame();
  renderAll();
}

function saveGame() {
  state.lastSaveTime = Date.now();
  try {
    localStorage.setItem(GAME_SETTINGS.saveKey, JSON.stringify(state));
  } catch (e) {
    console.warn("Save failed", e);
  }
}

function loadGame() {
  let raw;
  try { raw = localStorage.getItem(GAME_SETTINGS.saveKey); } catch (e) { raw = null; }
  if (!raw) return;
  try {
    const loaded = JSON.parse(raw);
    state = Object.assign(freshState(), loaded);
    state.buildingsOwned = loaded.buildingsOwned || {};
    state.upgradesBought = loaded.upgradesBought || {};
    state.achievementsUnlocked = loaded.achievementsUnlocked || {};
  } catch (e) {
    console.warn("Save file was corrupt, starting fresh.", e);
    state = freshState();
  }
}

function spawnFloatingNumber(value) {
  const layer = document.getElementById("floatLayer");
  if (!layer) return;
  const el = document.createElement("div");
  el.className = "float-num";
  el.textContent = "+" + fmtNumber(value);
  el.style.left = (30 + Math.random() * 40) + "%";
  el.style.top = (30 + Math.random() * 30) + "%";
  // small random tilt and size wobble so a burst of clicks doesn't look
  // like the exact same sprite stamped over and over
  const tilt = (Math.random() * 16 - 8).toFixed(1);
  const size = (1.0 + Math.random() * 0.25).toFixed(2);
  el.style.fontSize = size + "rem";
  el.style.setProperty("--tilt", tilt + "deg");
  layer.appendChild(el);
  setTimeout(() => el.remove(), 850);
}

function bounceMainClickable() {
  const btn = document.getElementById("mainClickable");
  if (!btn) return;
  btn.classList.remove("clicked");
  void btn.offsetWidth;
  btn.classList.add("clicked");
  setTimeout(() => { btn.classList.remove("clicked"); }, 160);
}

function flashEventBanner(text, durationSec) {
  const banner = document.getElementById("eventBanner");
  if (!banner) return;
  banner.textContent = text;
  banner.classList.remove("hidden");
  clearTimeout(banner._timeout);
  banner._timeout = setTimeout(hideEventBanner, (durationSec || 3.5) * 1000);
}
function hideEventBanner() {
  const banner = document.getElementById("eventBanner");
  if (banner) banner.classList.add("hidden");
}

let toastQueue = [];
let toastShowing = false;
function showAchievementToast(a) {
  toastQueue.push(a);
  if (!toastShowing) drainToastQueue();
}
function drainToastQueue() {
  if (toastQueue.length === 0) { toastShowing = false; return; }
  toastShowing = true;
  const a = toastQueue.shift();
  const toast = document.getElementById("achievementToast");
  const iconWrap = document.getElementById("toastIconWrap");
  const nameEl = document.getElementById("toastName");
  nameEl.textContent = a.name;
  iconWrap.innerHTML = "";
  iconWrap.appendChild(renderIcon(a.icon, a.color));
  toast.classList.remove("hidden");
  requestAnimationFrame(() => toast.classList.add("show"));
  setTimeout(() => {
    toast.classList.remove("show");
    setTimeout(() => { toast.classList.add("hidden"); drainToastQueue(); }, 350);
  }, 2600);
}

/* Tracks the last points value we displayed so the counter can pop with
   a little scale/color bump whenever the DISPLAYED text actually
   changes - both from clicking and from passive per-second production -
   instead of on every single tick. Once you're past a few thousand Gul
   Wilma, fmtNumber() rounds many consecutive raw values down to the
   exact same displayed string, so comparing the formatted text (not
   just the raw number) is what keeps the bump from firing every second
   even when nothing visibly moved. Only fires on an increase, never on
   a decrease (buying something), since a purchase already gets its own
   feedback (the sound, the card updating). */
let lastRenderedPoints = 0;
function renderTopStats() {
  const pointsEl = document.getElementById("statPoints");
  const formatted = fmtNumber(state.points);
  if (state.points > lastRenderedPoints && formatted !== pointsEl.textContent) {
    pointsEl.classList.remove("bump");
    void pointsEl.offsetWidth; // restart the animation even if it's still mid-play
    pointsEl.classList.add("bump");
  }
  lastRenderedPoints = state.points;
  pointsEl.textContent = formatted;
  document.getElementById("statCurrencyLabel").textContent = GAME_SETTINGS.currencyNamePlural;
  pointsPerSecondCache = computePointsPerSecond();
  document.getElementById("statPerSecond").textContent = fmtRate(pointsPerSecondCache) + "/s";
}

function renderMainClickable() {
  document.getElementById("gameTitle").textContent = GAME_SETTINGS.gameTitle;
  document.title = GAME_SETTINGS.gameTitle;
  document.getElementById("clickableDescription").textContent = mainClickable.description;

  const btn = document.getElementById("mainClickable");
  const svgFace = btn.querySelector("svg.botby-face");
  let img = btn.querySelector("img.custom-photo");
  const photoSrc = localAssets.clickerbutton;
  if (photoSrc) {
    if (svgFace) svgFace.classList.add("hidden");
    if (!img) {
      img = document.createElement("img");
      img.className = "custom-photo";
      img.alt = "";
      btn.insertBefore(img, btn.firstChild);
    }
    img.src = photoSrc;
  } else {
    if (img) img.remove();
    if (svgFace) svgFace.classList.remove("hidden");
  }
}

/* Short hover-tooltip summary of what a card actually does, instead of
   its longer flavor description. Built straight from the effect object
   so it always matches the real numbers (percentages are rounded the
   same way the rest of the UI rounds them). Used as the title attribute
   on building and upgrade cards - shown by the browser on hover. */
function formatEffectTooltip(effect) {
  if (!effect) return "";
  switch (effect.type) {
    case "clickMultiplier":
      return `+${Math.round((effect.value - 1) * 100)}% mera Gul Wilma per click`;
    case "clickFlatBonus":
      return `+${fmtNumber(effect.value)} mera Gul Wilma per click`;
    case "globalProductionMultiplier":
      return `+${Math.round((effect.value - 1) * 100)}% mera Gul Wilma`;
    case "buildingMultiplier": {
      const target = buildingById[effect.targetId];
      const name = target ? target.name : "Personalen";
      return `${name} blir ${Math.round((effect.value - 1) * 100)}% mera effektiv`;
    }
    default:
      return "Låser upp nya uppgraderingar";
  }
}

function buildingHoverTooltip(b) {
  return `+${fmtRate(buildingEffectivePerUnitProduction(b))}/s Gul Wilma styck\n${buildingShareOfProductionText(b)}`;
}

/* Custom hover tooltip, styled like Cookie Clicker's big white info box -
   a native title attribute can't be styled at all (small, plain, browser-
   controlled), so this is a real DOM element instead. Shown on
   mouseenter, positioned just outside the hovered card (to its left when
   there's room, otherwise flipped to its right so it never runs off the
   edge of the window), and hidden on mouseleave or on scroll (since a
   fixed-position tooltip would otherwise drift away from the card it's
   pointing at). */
let customTooltipEl = null;
function getCustomTooltip() {
  if (!customTooltipEl) {
    customTooltipEl = document.createElement("div");
    customTooltipEl.id = "customTooltip";
    document.body.appendChild(customTooltipEl);
  }
  return customTooltipEl;
}
function showTooltip(target) {
  const text = target.dataset.tooltip;
  if (!text) return;
  const tip = getCustomTooltip();
  tip.textContent = text;
  tip.classList.add("show");
  positionTooltip(target);
}
function positionTooltip(target) {
  const tip = getCustomTooltip();
  if (!tip.classList.contains("show")) return;
  const rect = target.getBoundingClientRect();
  const tipRect = tip.getBoundingClientRect();
  const gap = 14;
  let left = rect.left - tipRect.width - gap;
  if (left < 8) left = rect.right + gap;
  left = Math.min(left, window.innerWidth - tipRect.width - 8);
  let top = rect.top + rect.height / 2 - tipRect.height / 2;
  top = Math.max(8, Math.min(top, window.innerHeight - tipRect.height - 8));
  tip.style.left = left + "px";
  tip.style.top = top + "px";
}
function hideTooltip() {
  if (customTooltipEl) customTooltipEl.classList.remove("show");
}
function attachTooltip(el) {
  el.addEventListener("mouseenter", () => showTooltip(el));
  el.addEventListener("mouseleave", hideTooltip);
}

function renderBuildings() {
  const list = document.getElementById("buildingList");
  list.innerHTML = "";
  const unlocked = buildings.filter(isBuildingUnlocked);
  if (unlocked.length === 0) {
    list.innerHTML = `<p class="item-desc">Tjäna lite ${GAME_SETTINGS.currencyNamePlural} för att anställa din första i personalen.</p>`;
    return;
  }
  unlocked.forEach((b) => {
    const owned = buildingOwnedCount(b.id);
    const cost = buildingCost(b);
    const affordable = state.points >= cost;

    const btn = document.createElement("button");
    btn.className = "item-card staff";
    btn.dataset.id = b.id;
    btn.disabled = !affordable;
    btn.dataset.tooltip = buildingHoverTooltip(b);
    attachTooltip(btn);
    btn.appendChild(buildStaffThumb(b));

    const body = document.createElement("div");
    body.className = "item-body";
    body.innerHTML = `
      <p class="item-name hand">${escapeHtml(b.name)}</p>
      <p class="item-meta">${fmtNumber(cost)} ${GAME_SETTINGS.currencyAbbrev} · +${fmtRate(buildingEffectivePerUnitProduction(b))}/s styck</p>
    `;
    btn.appendChild(body);

    const badge = document.createElement("span");
    badge.className = "item-count-badge";
    badge.textContent = owned;
    btn.appendChild(badge);

    btn.addEventListener("click", () => buyBuilding(b.id));
    list.appendChild(btn);
  });
}

function renderUpgrades() {
  const list = document.getElementById("upgradeList");
  list.innerHTML = "";
  const visible = allUpgrades
    .filter((u) => !state.upgradesBought[u.id] && isUpgradeUnlocked(u))
    .sort((a, b) => a.cost - b.cost);
  if (visible.length === 0) {
    list.innerHTML = `<p class="item-desc">Inga uppgraderingar tillgängliga än.</p>`;
    return;
  }
  visible.forEach((u) => {
    const affordable = state.points >= u.cost;
    const card = document.createElement("div");
    card.className = "item-card compact" + (affordable ? "" : " disabled-card");
    card.dataset.id = u.id;
    card.setAttribute("role", "button");
    card.setAttribute("tabindex", "0");
    card.dataset.tooltip = formatEffectTooltip(u.effect);
    attachTooltip(card);
    card.appendChild(buildUpgradeThumb(u));

    const body = document.createElement("div");
    body.className = "item-body";
    body.innerHTML = `
      <p class="item-name hand">${escapeHtml(u.name)}</p>
      <p class="item-meta">${fmtNumber(u.cost)} ${GAME_SETTINGS.currencyAbbrev}</p>
    `;
    card.appendChild(body);

    const activate = () => { if (state.points >= u.cost) buyUpgrade(u.id); };
    card.addEventListener("click", activate);
    card.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(); }
    });
    list.appendChild(card);
  });
}

/* renderBuildings()/renderUpgrades() tear down and rebuild every card's
   DOM node from scratch - fine for an actual change (buying something,
   a new unlock), but doing that every second (which is how often costs/
   affordability need to refresh) meant every card was a brand new
   element each second. That silently broke the hover tooltips: browsers
   only show a native title tooltip after you've held the mouse still
   over the SAME element for roughly a second, and a card getting
   replaced out from under the cursor before that timer fires means the
   tooltip can never appear.

   These two functions do the once-a-second refresh (price, afford-
   ability, badge count, tooltip text) by updating the existing DOM
   nodes in place instead of replacing them, using the data-id set on
   each card above to find them. They only fall back to a full rebuild
   when the actual set of visible cards has changed (something bought,
   something newly unlocked) - a full rebuild in that moment is fine
   since it's an infrequent event, not a once-a-second one. */
function refreshBuildingCards() {
  const list = document.getElementById("buildingList");
  const unlocked = buildings.filter(isBuildingUnlocked);
  const currentIds = Array.from(list.children).map((el) => el.dataset.id);
  const targetIds = unlocked.map((b) => b.id);
  if (currentIds.length !== targetIds.length || currentIds.some((id, i) => id !== targetIds[i])) {
    renderBuildings();
    return;
  }
  unlocked.forEach((b) => {
    const btn = list.querySelector(`[data-id="${b.id}"]`);
    if (!btn) return;
    const cost = buildingCost(b);
    const affordable = state.points >= cost;
    btn.disabled = !affordable;
    btn.dataset.tooltip = buildingHoverTooltip(b);
    const meta = btn.querySelector(".item-meta");
    if (meta) meta.textContent = `${fmtNumber(cost)} ${GAME_SETTINGS.currencyAbbrev} · +${fmtRate(buildingEffectivePerUnitProduction(b))}/s styck`;
    const badge = btn.querySelector(".item-count-badge");
    if (badge) badge.textContent = buildingOwnedCount(b.id);
  });
}

function refreshUpgradeCards() {
  const list = document.getElementById("upgradeList");
  const visible = allUpgrades
    .filter((u) => !state.upgradesBought[u.id] && isUpgradeUnlocked(u))
    .sort((a, b) => a.cost - b.cost);
  const currentIds = Array.from(list.children).map((el) => el.dataset.id);
  const targetIds = visible.map((u) => u.id);
  if (currentIds.length !== targetIds.length || currentIds.some((id, i) => id !== targetIds[i])) {
    renderUpgrades();
    return;
  }
  visible.forEach((u) => {
    const card = list.querySelector(`[data-id="${u.id}"]`);
    if (!card) return;
    const affordable = state.points >= u.cost;
    card.classList.toggle("disabled-card", !affordable);
    card.dataset.tooltip = formatEffectTooltip(u.effect);
  });
}

function renderAchievements() {
  const list = document.getElementById("achievementList");
  list.innerHTML = "";
  const unlockedCount = Object.keys(state.achievementsUnlocked).length;
  document.getElementById("achievementsProgress").textContent = `Betyg (${unlockedCount} / ${achievements.length})`;
  achievements.forEach((a) => {
    const unlocked = !!state.achievementsUnlocked[a.id];
    const card = document.createElement("div");
    card.className = "mini-card" + (unlocked ? "" : " locked");
    const iconBox = document.createElement("div");
    iconBox.className = "mini-icon";
    iconBox.appendChild(renderIcon(a.icon, unlocked ? a.color : "#c7c0b2"));
    card.appendChild(iconBox);
    const name = document.createElement("div");
    name.className = "mini-card-name";
    name.textContent = unlocked ? a.name : "???";
    card.appendChild(name);
    const desc = document.createElement("div");
    desc.className = "mini-card-desc";
    desc.textContent = unlocked ? a.description : "Fortsätt spela för att låsa upp.";
    card.appendChild(desc);
    list.appendChild(card);
  });
}

/* Shows each hired staff member's share of the total per-second income,
   using buildingRawProduction() above (i.e. ignoring upgrades entirely -
   just base rate, the automatic per-owned growth bonus, and headcount).
   Percentages are rounded for readability; anything under 0.1% shows as
   "<0.1%" rather than "0%" so a newly-hired single copy of someone still
   reads as present instead of invisible. */
function renderStaffShareSection() {
  const owned = buildings.filter((b) => buildingOwnedCount(b.id) > 0);
  const totalRaw = owned.reduce((sum, b) => sum + buildingRawProduction(b), 0);
  if (owned.length === 0 || totalRaw <= 0) {
    return `<div class="stats-subhead">Personalens andel av total Gul Wilma-produktion</div><p class="item-desc">Ingen personal anställd än.</p>`;
  }
  const rows = owned
    .slice()
    .sort((a, b) => buildingRawProduction(b) - buildingRawProduction(a))
    .map((b) => {
      const share = (buildingRawProduction(b) / totalRaw) * 100;
      const shareText = share < 0.1 ? "<0.1% av total gul wilma produktion" : `${share.toFixed(share < 10 ? 1 : 0)}% av total gul wilma produktion`;
      return `<div class="staff-stat-row"><span class="ssr-name">${escapeHtml(b.name)}</span><span class="ssr-owned">${fmtNumber(buildingOwnedCount(b.id))} st</span><span class="ssr-rate">${shareText}</span></div>`;
    })
    .join("");
  return `<div class="stats-subhead">Personalens andel av total Gul Wilma-produktion (utan uppgraderingar)</div>${rows}`;
}

function renderStats() {
  const panel = document.getElementById("statsPanel");
  const now = Date.now();
  const runMs = now - (state.createdAt || now);
  const mostOwnedBuilding = buildings.reduce((best, b) => {
    const owned = buildingOwnedCount(b.id);
    return (!best || owned > best.owned) ? { name: b.name, owned } : best;
  }, null);

  const rows = [
    ["Läsåret startade", fmtDate(state.createdAt)],
    ["Tid spelad", fmtDuration(runMs)],
    ["Gul Wilma totalt", fmtNumber(state.totalPointsEarned)],
    ["Gul Wilma just nu", fmtNumber(state.points)],
    ["Antal click", fmtNumber(state.totalClicks)],
    ["Personal", fmtNumber(Object.values(state.buildingsOwned).reduce((a,b)=>a+b,0))],
    ["Mest anställda", mostOwnedBuilding && mostOwnedBuilding.owned > 0 ? `${mostOwnedBuilding.name} (${fmtNumber(mostOwnedBuilding.owned)})` : "—"],
    ["Uppgraderingar köpta", `${fmtNumber(Object.keys(state.upgradesBought).length)} / ${allUpgrades.length}`],
    ["Betyg", `${Object.keys(state.achievementsUnlocked).length} / ${achievements.length}`],
    [GAME_SETTINGS.prestigeCurrencyName, fmtNumber(state.bonds)],
    ["Nya läsår", fmtNumber(state.prestigeCount)],
    ["Senast sparat", fmtDate(state.lastSaveTime)],
  ];
  panel.innerHTML = rows.map(([label, val]) =>
    `<div class="stats-row"><span>${label}</span><span>${val}</span></div>`
  ).join("") + renderStaffShareSection();

  const gain = bondsAvailableOnReset();
  const remaining = pointsNeededForNextBond();
  document.getElementById("prestigeInfo").textContent =
    gain > 0
      ? `Starta ett nytt läsår nu för ${gain} ${GAME_SETTINGS.prestigeCurrencyName}. Varje ger +1% på all Gul Wilma, permanent. ${fmtNumber(remaining)} ${GAME_SETTINGS.currencyAbbrev} till nästa.`
      : `${fmtNumber(remaining)} ${GAME_SETTINGS.currencyAbbrev} kvar innan du kan starta ett nytt läsår. Varje ${GAME_SETTINGS.prestigeCurrencyName} ger +2% på all Gul Wilma, permanent.`;
  document.getElementById("btnPrestige").disabled = gain < 1;

  // Progress bar toward the NEXT Nytt ämne tick - same cube-root thresholds
  // bondsAvailableOnReset()/pointsNeededForNextBond() already use.
  const currentThreshold = Math.pow(gain, 3) * PRESTIGE_THRESHOLD;
  const nextThreshold = Math.pow(gain + 1, 3) * PRESTIGE_THRESHOLD;
  const span = nextThreshold - currentThreshold;
  const progressFraction = span > 0
    ? clamp((state.totalPointsEarned - currentThreshold) / span, 0, 1)
    : 1;
  document.getElementById("prestigeProgressFill").style.width = `${(progressFraction * 100).toFixed(1)}%`;
  document.getElementById("prestigeProgressLabel").textContent = `${Math.floor(progressFraction * 100)}%`;

  renderImageDebugPanel();
}

/* On-screen troubleshooting panel: shows, for every local photo slot,
   whether an image file was found and — if not — the exact filenames
   it tried, so filename/extension mismatches are visible without
   opening devtools. Only relevant entries (upgrades that have a
   UPGRADE_LOCAL_PHOTOS mapping, plus staff and background/button) are
   listed. */
function renderImageDebugPanel() {
  let box = document.getElementById("imageDebugBox");
  if (!box) {
    box = document.createElement("div");
    box.id = "imageDebugBox";
    box.style.marginTop = "0.9rem";
    box.style.padding = "0.7rem 0.8rem";
    box.style.border = "1px dashed var(--line)";
    box.style.borderRadius = "0.6rem";
    box.style.fontSize = "0.72rem";
    box.style.lineHeight = "1.5";
    const dangerBox = document.querySelector("#panel-stats .danger-box");
    dangerBox.parentElement.insertBefore(box, dangerBox.nextSibling);
  }

  const entries = [
    ...buildings.map((b) => [b.id, b.name]),
    ...manualUpgrades.map((u) => [u.id, u.name]),
    [AMNEN_UPGRADE.id, AMNEN_UPGRADE.name],
    ...subjectRootUpgrades.map((u) => [u.id, u.name]),
    ["clickerbutton", "Clickknappen"],
    ["background", "Bakgrund"],
  ];

  const rows = entries.map(([key, label]) => {
    const d = imageLoadDebug[key];
    if (!d) return `<div><b>${escapeHtml(label)}</b>: väntar…</div>`;
    if (d.found) {
      return `<div><b>${escapeHtml(label)}</b>: ✅ hittad (<code>${escapeHtml(d.found)}</code>)</div>`;
    }
    const firstFew = d.tried.slice(0, 4).map((p) => `<code>${escapeHtml(p)}</code>`).join(", ");
    const more = d.tried.length > 4 ? ` … (+${d.tried.length - 4} till)` : "";
    return `<div><b>${escapeHtml(label)}</b>: ❌ ingen bild hittad. Provade t.ex. ${firstFew}${more}</div>`;
  });

  box.innerHTML =
    `<div style="font-family:var(--font-display);font-weight:700;color:var(--gold-dim);margin-bottom:0.3rem;">Bildfelsökning</div>` +
    `<div style="opacity:0.8;margin-bottom:0.4rem;">Lägg bildfilen i SAMMA mapp som HTML-filen, med exakt något av namnen nedan (skiftläge/ändelse spelar mindre roll).</div>` +
    rows.join("");
}

function escapeHtml(str) {
  if (!str) return "";
  return str.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function renderAll() {
  renderTopStats();
  renderMainClickable();
  renderBuildings();
  renderUpgrades();
  renderAchievements();
  renderStats();
  renderInfo();
}

function setupTabs() {
  const buttons = document.querySelectorAll(".tab-btn");
  buttons.forEach((btn) => {
    btn.addEventListener("click", () => {
      buttons.forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      document.querySelectorAll(".tab-panel").forEach((p) => p.classList.remove("active"));
      document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
      hideTooltip();
    });
  });
}

/* The tooltip is fixed-position, anchored to a card's on-screen location
   at the moment it's shown. Scrolling the store list (or switching tabs,
   handled above) moves the card without moving the tooltip, so both
   just hide it outright rather than trying to track the scroll. */
function setupTooltipDismissal() {
  document.querySelectorAll(".tab-panel").forEach((panel) => {
    panel.addEventListener("scroll", hideTooltip, { passive: true });
  });
  window.addEventListener("resize", hideTooltip);
}

function setupClickHandler() {
  document.getElementById("mainClickable").addEventListener("click", doClick);
}

function setupPrestige() {
  document.getElementById("btnPrestige").addEventListener("click", () => {
    const gain = bondsAvailableOnReset();
    if (gain < 1) return;
    if (!confirm(`Starta ett nytt läsår för ${gain} ${GAME_SETTINGS.prestigeCurrencyName}? Betyg sparas.`)) return;
    doPrestige();
  });
}

function doFullRestart() {
  try {
    localStorage.removeItem(GAME_SETTINGS.saveKey);
  } catch (e) {
    console.warn("Could not clear save", e);
  }
  state = freshState();
  hideEventBanner();
  renderAll();
}

function setupRestart() {
  const btn = document.getElementById("btnRestart");
  if (!btn) return;
  btn.addEventListener("click", () => {
    const sure = confirm(
      "Är du säker? All personal, alla uppgraderingar, betyg och Nya ämnen försvinner permanent och kan inte återställas."
    );
    if (!sure) return;
    doFullRestart();
  });
}

}

/* Ticks by real elapsed wall-clock time rather than assuming the fixed
   interval always fires on schedule, so background tabs (where browsers
   throttle timers to roughly once a second) still accrue Gul Wilma at
   the correct rate instead of stalling.

   That said, Gul Wilma should only ever be earned while the game is
   actually running somewhere - open in a tab, foreground or background -
   never for time the computer was asleep or the browser was fully
   closed. JS simply doesn't run during that time, so ticks don't fire
   and no points are added for it automatically; the one place that
   real-world sleep time WOULD sneak in is the single "catch up" tick
   fired right when the tab becomes visible again, since Date.now() has
   jumped forward by however long the computer was actually off/asleep.
   MAX_TICK_GAP_MS caps how much of that jump can ever be paid out - kept
   short (well under a minute) so a normal short throttle/hiccup still
   pays out correctly, but a laptop closed overnight or a browser that
   was quit doesn't hand out hours of "offline" Gul Wilma on return. */
let lastTickAt = Date.now();
const MAX_TICK_GAP_MS = 30 * 1000;
function tick() {
  const now = Date.now();
  const dtSec = Math.min(now - lastTickAt, MAX_TICK_GAP_MS) / 1000;
  lastTickAt = now;
  const pps = computePointsPerSecond();
  if (pps > 0 && dtSec > 0) addPoints(pps * dtSec);
  checkAchievements();
  renderTopStats();
}

async function init() {
  loadGame();
  setupTabs();
  setupTooltipDismissal();
  setupClickHandler();
  setupPrestige();
  setupRestart();
  setupDarkMode();
  await preloadLocalAssets();
  applyBackgroundPhoto();
  renderAll();

  lastTickAt = Date.now();
  setInterval(tick, GAME_SETTINGS.tickIntervalMs);
  setInterval(() => { refreshBuildingCards(); refreshUpgradeCards(); renderStats(); }, 1000);
  setInterval(saveGame, GAME_SETTINGS.autosaveIntervalSec * 1000);
  window.addEventListener("beforeunload", saveGame);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      saveGame();
    } else {
      lastTickAt = Date.now(); // don't pay out for time the tab/computer was closed or asleep
      tick();
    }
  });
}

document.addEventListener("DOMContentLoaded", init);
</script>
