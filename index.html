<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#f3efe6;
  --bg-deep-2:#e9e3d4;
  --bg-panel:#fbf9f4;
  --bg-panel-2:#efeadd;
  --bg-panel-3:#e4ddcc;
  --gold:#ffb703;
  --gold-soft:#f2b93d;
  --gold-dim:#c07f0a;
  --coral:#ff5d6c;
  --coral-dim:#e0384a;
  --teal:#12d6a0;
  --teal-dim:#0a9770;
  --blue:#4cc9f0;
  --blue-dim:#2a94b8;
  --purple:#b185f5;
  --purple-dim:#8257c9;
  --pink:#ff8fc7;
  --pink-dim:#e05fa0;
  --cream:#fdfbf7;
  --ink:#2b2118;
  --line:rgba(43,33,24,0.15);
  --shadow:rgba(30,20,10,0.16);
  --chalkboard:#2e4a3c;
  --chalkboard-dark:#182a21;
  --wood:#e6d3ae;
  --wood-dark:#cdae7c;
  --bg-photo:none;
  --font-display:'Fredoka', sans-serif;
  --font-hand:'Fredoka', sans-serif;
  --font-body:'Nunito', sans-serif;
  --font-num:'Space Grotesk', monospace;
}
body.dark-mode{
  --bg-deep:#181a17;
  --bg-deep-2:#101210;
  --bg-panel:#1f221e;
  --bg-panel-2:#262a23;
  --bg-panel-3:#2e332a;
  --cream:#22251f;
  --ink:#efe9db;
  --line:rgba(239,233,219,0.14);
  --shadow:rgba(0,0,0,0.5);
  --wood:#4a3d27;
  --wood-dark:#332a1a;
}
*{box-sizing:border-box;}
html,body{
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--bg-deep);
  font-family:var(--font-body);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
::selection{background:var(--coral);color:#fff;}
*{scrollbar-width:thin;scrollbar-color:var(--gold-dim) transparent;}
*::-webkit-scrollbar{width:9px;height:9px;}
*::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:6px;}
*::-webkit-scrollbar-track{background:transparent;}
.hidden{display:none !important;}
#app{
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  position:relative;
  background:
    radial-gradient(circle at 100% 0%, rgba(18,214,160,0.10), transparent 38%),
    radial-gradient(circle at 90% 85%, rgba(177,133,245,0.09), transparent 42%),
    radial-gradient(circle at 5% 90%, rgba(255,143,199,0.08), transparent 38%),
    linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-deep-2) 100%);
  transition:background .2s ease;
}
#app.has-bg-photo{
  background-image: var(--bg-photo);
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  background-attachment:fixed;
}
body.dark-mode #app.has-bg-photo{
  background-image: var(--bg-photo);
}
.left-column{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  min-height:0;
}
header{
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:1rem;
  padding:0.6rem 1.4rem 0.9rem;
  border-bottom:2px dashed var(--line);
  background:linear-gradient(180deg, rgba(255,183,3,0.09), rgba(255,183,3,0) 85%);
  box-shadow:0 4px 14px rgba(30,20,10,0.05);
  position:relative;
  z-index:2;
}
.brand{display:flex;align-items:center;gap:0.7rem;}
.brand h1{
  font-family:var(--font-display);
  font-weight:700;
  font-size:1.7rem;
  margin:0;
  color:var(--gold-dim);
  letter-spacing:0.01em;
  display:inline-block;
}
#btnDarkMode, #btnMute{
  border:1px solid var(--line);
  background:var(--bg-panel-2);
  color:var(--ink);
  width:2.2rem;height:2.2rem;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  font-size:1rem;
  flex:none;
  transition:background .15s ease, transform .1s ease;
}
#btnDarkMode:hover, #btnMute:hover{background:var(--bg-panel-3);}
#btnDarkMode:active, #btnMute:active{transform:scale(0.92);}
.header-stats{display:flex;flex-direction:column;align-items:center;line-height:1.05;user-select:none;-webkit-user-select:none;}
#statPoints{
  font-family:var(--font-num);
  font-weight:700;
  font-size:2rem;
  color:var(--ink);
  display:inline-block;
  transform-origin:center;
}
#statPoints.bump{animation:statPointsBump 0.4s ease-out;}
@keyframes statPointsBump{
  0%{transform:scale(1);}
  35%{transform:scale(1.16);}
  100%{transform:scale(1);}
}
body.reduce-motion #statPoints.bump{animation:none;}
#statCurrencyLabel{
  font-size:0.75rem;
  color:var(--gold-dim);
  text-transform:uppercase;
  letter-spacing:0.12em;
  font-weight:700;
}
#statPerSecond{font-family:var(--font-num);font-size:0.85rem;color:var(--ink);margin-top:0.1rem;font-weight:600;}
.main-layout{flex:1;min-height:0;display:flex;gap:0;}
.click-stage{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  padding:1rem;
  gap:0.9rem;
}
.click-stage-inner{position:relative;display:flex;flex-direction:column;align-items:center;}
#mainClickable{
  width:min(51vh, 55vw, 24rem);
  height:min(51vh, 55vw, 24rem);
  border-radius:50%;
  border:none;
  cursor:pointer;
  position:relative;
  background:radial-gradient(circle at 50% 40%, var(--chalkboard) 0%, var(--chalkboard-dark) 100%);
  box-shadow:
    0 0 0 0.6rem #ffffff,
    0 0 0 0.85rem #e8e8e8,
    0 0 0 1.1rem rgba(255,183,3,0.18),
    0 1.6rem 3.2rem var(--shadow),
    inset 0 -0.6rem 1.4rem rgba(0,0,0,0.45),
    inset 0 0.6rem 1.4rem rgba(255,255,255,0.05);
  transition:transform .1s ease;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
#mainClickable:hover{filter:brightness(1.08);}
#mainClickable.clicked{animation:clickBounce 0.15s ease-out;}
@keyframes clickBounce{
  0%{transform:scale(1);}
  50%{transform:scale(0.94);}
  100%{transform:scale(1);}
}
body.reduce-motion #mainClickable.clicked{animation:none;}
img.custom-photo{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
}
#clickableDescription{max-width:24rem;text-align:center;font-size:0.95rem;font-family:var(--font-body);font-weight:600;color:var(--ink);opacity:0.75;margin:0;}
#floatLayer{position:absolute;inset:0;pointer-events:none;overflow:visible;}
.float-num{
  position:absolute;
  font-family:var(--font-display);
  font-weight:700;
  color:var(--gold-dim);
  text-shadow:0 2px 6px rgba(0,0,0,0.15);
  animation:floatUp 0.8s ease-out forwards;
  user-select:none;
  -webkit-user-select:none;
  --tilt:0deg;
}
@keyframes floatUp{
  0%{opacity:1; transform:translateY(0) scale(0.9) rotate(0deg);}
  100%{opacity:0; transform:translateY(-3.2rem) scale(1) rotate(var(--tilt));}
}
body.reduce-motion .float-num{animation:floatUpReduced 0.8s ease-out forwards;}
@keyframes floatUpReduced{0%{opacity:1;}80%{opacity:1;}100%{opacity:0;}}
.side-panel{
  flex:none;
  width:26rem;
  max-width:42vw;
  border-left:2px dashed var(--line);
  background-color:var(--bg-panel);
  box-shadow:-10px 0 26px rgba(30,20,10,0.06);
  display:flex;
  flex-direction:column;
  min-height:0;
}
.tab-bar{flex:none;display:flex;border-bottom:1px solid var(--line);}
.tab-btn{
  flex:1;
  border:none;
  background:transparent;
  color:var(--ink);
  opacity:0.55;
  font-family:var(--font-display);
  font-weight:500;
  font-size:0.82rem;
  padding:0.75rem 0.3rem;
  cursor:pointer;
  border-bottom:2px solid transparent;
  transition:opacity .15s ease, border-color .15s ease, background .15s ease;
}
.tab-btn:hover{opacity:0.85;background:rgba(0,0,0,0.03);}
.tab-btn.active{opacity:1;color:var(--gold-dim);border-bottom-color:var(--coral);background:rgba(0,0,0,0.03);}
.tab-panel{display:none;flex-direction:column;min-height:0;flex:1;overflow-y:auto;padding:0.9rem;gap:0.7rem;}
.tab-panel.active{display:flex;}
.section-label{
  font-family:var(--font-display);
  font-size:0.9rem;
  font-weight:700;
  color:var(--gold-dim);
  margin:0.3rem 0 0.1rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.item-card{
  display:flex;
  align-items:center;
  gap:0.7rem;
  width:100%;
  text-align:left;
  border:1px solid var(--line);
  background:var(--cream);
  border-radius:0.6rem;
  padding:0.6rem 0.7rem 0.6rem 0.7rem;
  color:var(--ink);
  cursor:pointer;
  position:relative;
  box-shadow:0 2px 6px var(--shadow);
  transition:transform .12s ease, box-shadow .2s ease, filter .2s ease;
  margin-top:0.35rem;
}
.item-card:not(.disabled-card):hover{
  transform:translateY(-2px);
  box-shadow:0 0 0 2px var(--gold), 0 8px 16px var(--shadow);
  filter:brightness(1.02);
}
.item-card:not(.disabled-card):active{transform:translateY(0) scale(0.98);filter:brightness(1.0);}
body.reduce-motion .item-card:not(.disabled-card):hover{transform:none;}
.item-card:disabled{opacity:0.5;cursor:not-allowed;filter:grayscale(0.35);}
.item-card.disabled-card{opacity:0.5;cursor:not-allowed;filter:grayscale(0.35);}
.item-thumb{
  width:2.7rem;height:2.7rem;
  border-radius:0.6rem;
  flex:none;
  background:var(--bg-panel-3);
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.item-thumb:has(img){padding:0;}
.item-thumb:not(:has(img)){padding:0.45rem;}
.item-thumb svg{width:100%;height:100%;display:block;animation:idleSway 3.6s ease-in-out infinite;}
body.reduce-motion .item-thumb svg{animation:none;}
@keyframes idleSway{
  0%,100%{transform:rotate(-3deg);}
  50%{transform:rotate(3deg);}
}
.item-body{flex:1;min-width:0;}
.item-name{font-family:var(--font-display);font-weight:600;font-size:0.9rem;margin:0 0 0.1rem;color:var(--coral-dim);}
.item-name.hand{font-family:var(--font-display);font-weight:600;font-size:0.95rem;margin:0 0 0.2rem;line-height:1.2;color:var(--ink);}
.item-card.staff,
.item-card.compact{padding-top:0.7rem;padding-bottom:0.7rem;align-items:center;}
.item-card.staff .item-thumb,
.item-card.compact .item-thumb{width:3.1rem;height:3.1rem;}
.item-desc{font-size:0.72rem;color:var(--ink);opacity:0.72;margin:0 0 0.25rem;line-height:1.3;}
.item-meta{font-family:var(--font-num);font-size:0.72rem;color:var(--teal-dim);margin:0;font-weight:600;}
.item-count-badge{
  position:absolute;top:-0.4rem;right:-0.4rem;
  background:var(--coral);color:#fff;
  font-family:var(--font-num);font-weight:700;font-size:0.72rem;
  min-width:1.5rem;height:1.5rem;border-radius:999px;
  display:flex;align-items:center;justify-content:center;
  border:2px solid var(--bg-panel);
}
.mini-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.2rem,1fr));gap:1rem;padding:0.4rem 0.2rem 1rem;}
.mini-card{
  position:relative;
  background:var(--cream);
  color:var(--ink);
  padding:0.5rem 0.5rem 1.1rem;
  border-radius:0.5rem;
  border:1px solid var(--line);
  box-shadow:0 4px 10px var(--shadow);
  transition:transform .15s ease;
}
.mini-card:hover{transform:translateY(-2px);}
.mini-card.locked{filter:grayscale(1) brightness(0.9);opacity:0.7;}
.mini-card .mini-icon{
  width:100%;aspect-ratio:1/1;border-radius:0.4rem;
  background:var(--bg-panel-2);
  display:flex;align-items:center;justify-content:center;
  padding:1rem;
}
.mini-card .mini-icon svg{width:100%;height:100%;}
.mini-card-name{font-family:var(--font-display);font-weight:600;font-size:0.82rem;margin-top:0.4rem;text-align:center;}
.mini-card-desc{font-size:0.65rem;text-align:center;opacity:0.7;margin-top:0.15rem;}
.stats-row{display:flex;justify-content:space-between;padding:0.5rem 0.2rem;border-bottom:1px dashed var(--line);font-size:0.85rem;}
.stats-row span:last-child{font-family:var(--font-num);color:var(--gold-dim);font-weight:600;}
.prestige-box{
  margin-top:0.8rem;padding:0.9rem;border-radius:0.8rem;
  background:linear-gradient(160deg, rgba(232,178,61,0.1), rgba(79,174,140,0.06));
  border:1px solid var(--line);
}
#prestigeInfo{font-size:0.8rem;opacity:0.85;margin:0 0 0.7rem;line-height:1.4;}
.prestige-progress{position:relative;width:100%;height:1.1rem;border-radius:999px;background:var(--bg-panel-3);border:1px solid var(--line);overflow:hidden;margin:0 0 0.7rem;}
.prestige-progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));transition:width 0.3s ease;}
.prestige-progress-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:0.68rem;font-weight:600;color:var(--ink);}
.btn-primary{
  font-family:var(--font-display);font-weight:600;font-size:0.85rem;
  border:none;border-radius:0.6rem;padding:0.55rem 1.1rem;
  background:var(--gold);
  color:#2b2118;cursor:pointer;
  transition:filter .15s ease;
}
.btn-primary:hover:not(:disabled){filter:brightness(1.08);}
.btn-primary:disabled{opacity:0.35;cursor:not-allowed;}
.btn-danger{background:var(--coral-dim);color:#fff;}
.danger-box{
  margin-top:0.8rem;padding:0.9rem;border-radius:0.8rem;
  background:linear-gradient(160deg, rgba(224,56,74,0.1), rgba(224,56,74,0.04));
  border:1px solid var(--line);
}
.danger-box p{font-size:0.8rem;opacity:0.85;margin:0 0 0.7rem;line-height:1.4;}
.stats-subhead{
  font-family:var(--font-display);font-weight:600;font-size:0.8rem;
  color:var(--gold-dim);margin:0.9rem 0 0.2rem;text-transform:uppercase;letter-spacing:0.06em;
}
#infoText{
  flex:1;
  min-height:12rem;
  border:1px solid var(--line);
  border-radius:0.6rem;
  background:var(--cream);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:0.85rem;
  line-height:1.6;
  padding:0.7rem 0.8rem;
  box-shadow:0 2px 6px var(--shadow);
  white-space:pre-wrap;
}
.staff-stat-row{display:flex;justify-content:space-between;align-items:center;padding:0.35rem 0.2rem;border-bottom:1px dashed var(--line);font-size:0.8rem;gap:0.5rem;}
.staff-stat-row .ssr-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.staff-stat-row .ssr-owned{font-family:var(--font-num);color:var(--coral-dim);font-weight:600;flex:none;}
.staff-stat-row .ssr-rate{font-family:var(--font-num);color:var(--gold-dim);font-weight:600;flex:none;min-width:11rem;text-align:right;}
#customTooltip{
  position:fixed;
  z-index:120;
  max-width:19rem;
  min-width:11rem;
  background:var(--cream);
  border:2px solid var(--gold);
  border-radius:0.9rem;
  padding:0.85rem 1.05rem;
  box-shadow:0 14px 34px var(--shadow);
  font-family:var(--font-display);
  font-weight:600;
  font-size:1.05rem;
  line-height:1.35;
  color:var(--ink);
  pointer-events:none;
  opacity:0;
  white-space:pre-line;
  transform:translateY(4px) scale(0.98);
  transition:opacity .12s ease, transform .12s ease;
}
#customTooltip.show{opacity:1;transform:translateY(0) scale(1);}
body.reduce-motion #customTooltip{transition:opacity .12s ease;}
body.reduce-motion #customTooltip.show{transform:none;}
#achievementToast{
  position:fixed;right:1.2rem;bottom:1.2rem;
  display:flex;align-items:center;gap:0.7rem;
  background:linear-gradient(120deg, var(--bg-panel), var(--bg-panel-2));
  border:1px solid var(--gold);border-radius:0.9rem;padding:0.7rem 1rem;
  box-shadow:0 12px 26px var(--shadow);
  transform:translateY(1rem);opacity:0;
  transition:transform .3s ease, opacity .3s ease;
  z-index:60;
}
#achievementToast.show{animation:toastPop 0.55s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes toastPop{
  0%{transform:translateY(1.2rem) scale(0.9);opacity:0;}
  60%{transform:translateY(-0.2rem) scale(1.03);opacity:1;}
  100%{transform:translateY(0) scale(1);opacity:1;}
}
body.reduce-motion #achievementToast.show{animation:none;transform:translateY(0);opacity:1;}
#toastIconWrap{width:2.6rem;height:2.6rem;border-radius:0.5rem;background:var(--bg-panel-3);display:flex;align-items:center;justify-content:center;padding:0.4rem;flex:none;}
#toastIconWrap svg{width:100%;height:100%;}
.toast-label{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--gold-dim);font-weight:700;}
#toastName{font-family:var(--font-display);font-weight:600;color:var(--ink);font-size:1rem;}
@media (max-width: 860px){
  .main-layout{flex-direction:column;}
  .side-panel{width:100%;max-width:100%;border-left:none;border-top:2px dashed var(--line);flex:1;}
  #mainClickable{width:min(30vh,60vw,14rem);height:min(30vh,60vw,14rem);}
  .click-stage{padding:0.5rem;}
}
@media (max-width: 480px){
  .brand h1{font-size:1.3rem;}
  #statPoints{font-size:1.4rem;}
}
#megisGlowOverlay{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:50;
  background:radial-gradient(circle at 50% 38%, rgba(255,215,0,0.38), rgba(255,215,0,0.10) 55%, transparent 78%);
  opacity:0;
  transition:opacity 0.6s ease;
}
#megisTimer{
  position:fixed;
  top:0.65rem;
  left:50%;
  transform:translateX(-50%);
  z-index:56;
  display:flex;
  align-items:center;
  gap:0.4rem;
  background:linear-gradient(120deg, var(--gold), var(--gold-soft));
  color:#2b2118;
  font-family:var(--font-display);
  font-weight:700;
  font-size:0.85rem;
  padding:0.4rem 1rem;
  border-radius:999px;
  box-shadow:0 8px 20px var(--shadow);
  pointer-events:none;
  white-space:nowrap;
}
#megisGlowOverlay.show{opacity:1;}
.megis-cookie{
  position:absolute;
  width:7.6rem;
  height:7.6rem;
  border:none;
  padding:0;
  background:transparent;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  z-index:8;
  opacity:0;
  transform:translate(-50%,-50%) scale(0.2) rotate(0deg);
  filter:drop-shadow(0 0 0.9rem rgba(255,183,3,0.55));
  animation:megisAppear 1.4s ease-out forwards, megisGlowPulse 1.8s ease-in-out 1.4s infinite;
}
.megis-cookie img{width:100%;height:100%;object-fit:contain;}
.megis-cookie svg{width:100%;height:100%;}
.megis-cookie.claimed{animation:megisClaimed 1s ease-in forwards !important;}
.megis-cookie.despawning{animation:megisDespawn 6s ease-in-out forwards !important;}
@keyframes megisAppear{
  0%{opacity:0; transform:translate(-50%,-50%) scale(0.2) rotate(0deg);}
  16%{opacity:1; transform:translate(-50%,-50%) scale(0.4) rotate(-11deg);}
  34%{transform:translate(-50%,-50%) scale(0.58) rotate(10deg);}
  52%{transform:translate(-50%,-50%) scale(0.74) rotate(-8deg);}
  70%{transform:translate(-50%,-50%) scale(0.88) rotate(6deg);}
  86%{transform:translate(-50%,-50%) scale(0.97) rotate(-3deg);}
  100%{opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg);}
}
@keyframes megisClaimed{
  0%{opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg);}
  16%{transform:translate(-50%,-50%) scale(0.9) rotate(9deg);}
  34%{transform:translate(-50%,-50%) scale(0.74) rotate(-10deg);}
  52%{transform:translate(-50%,-50%) scale(0.56) rotate(8deg);}
  70%{transform:translate(-50%,-50%) scale(0.36) rotate(-7deg);}
  86%{opacity:0.55; transform:translate(-50%,-50%) scale(0.16) rotate(4deg);}
  100%{opacity:0; transform:translate(-50%,-50%) scale(0.02) rotate(0deg);}
}
@keyframes megisDespawn{
  0%{opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg);}
  100%{opacity:0; transform:translate(-50%,-50%) scale(0.82) rotate(0deg);}
}
@keyframes megisGlowPulse{
  0%,100%{filter:drop-shadow(0 0 0.9rem rgba(255,183,3,0.55));}
  50%{filter:drop-shadow(0 0 1.5rem rgba(255,183,3,0.85));}
}
body.reduce-motion .megis-cookie{animation:megisAppearReduced 0.3s ease-out forwards;}
body.reduce-motion .megis-cookie.claimed{animation:megisClaimedReduced 0.2s ease-out forwards !important;}
body.reduce-motion .megis-cookie.despawning{animation:megisDespawnReduced 0.3s ease-out forwards !important;}
@keyframes megisAppearReduced{0%{opacity:0;}100%{opacity:1;}}
@keyframes megisClaimedReduced{0%{opacity:1;}100%{opacity:0;}}
@keyframes megisDespawnReduced{0%{opacity:1;}100%{opacity:0;}}

.megis-effect-text{
  position:absolute;
  transform:translate(-50%,-50%);
  font-family:var(--font-display);
  font-weight:700;
  font-size:1.7rem;
  color:var(--gold-dim);
  text-shadow:0 2px 8px rgba(0,0,0,0.25), 0 0 16px rgba(255,183,3,0.55);
  pointer-events:none;
  white-space:nowrap;
  z-index:9;
  animation:megisEffectTextRise 1.4s ease-out forwards;
}
@keyframes megisEffectTextRise{
  0%{opacity:0; transform:translate(-50%,-50%) scale(0.6);}
  15%{opacity:1; transform:translate(-50%,-50%) scale(1.15);}
  30%{opacity:1; transform:translate(-50%,-60%) scale(1);}
  100%{opacity:0; transform:translate(-50%,-170%) scale(1);}
}
body.reduce-motion .megis-effect-text{animation:megisEffectTextRiseReduced 1.4s ease-out forwards;}
@keyframes megisEffectTextRiseReduced{0%{opacity:1;}80%{opacity:1;}100%{opacity:0;}}

const MIN_COST_RATIO = 1.3;
function dedupeAndSpaceCosts(list, minRatio) {
  const sorted = [...list].sort((a, b) => a.cost - b.cost || a.id.localeCompare(b.id));
  let prevCost = 0;
  sorted.forEach((u) => {
    const minAllowed = prevCost > 0 ? Math.ceil(prevCost * minRatio) : u.cost;
    u.cost = Math.max(u.cost, minAllowed);
    prevCost = u.cost;
  });
}
dedupeAndSpaceCosts(manualUpgrades, MIN_COST_RATIO);

function hashStr(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return h;
}
function makeFollowUpUpgrade(u, { suffix, roman, costMult, clickMultValue, flatBonusMult, prodMultShare, followUps, unlockFrom, minTotalPointsMult }) {
  let effect;
  if (u.effect.type === "clickMultiplier") {
    effect = { type: "clickMultiplier", value: clickMultValue };
  } else if (u.effect.type === "clickFlatBonus") {
    effect = { type: "clickFlatBonus", value: Math.round(u.effect.value * flatBonusMult) };
  } else if (u.effect.type === "globalProductionMultiplier") {
    effect = { type: "globalProductionMultiplier", value: 1 + (u.effect.value - 1) * prodMultShare };
  } else {
    effect = u.effect;
  }
  const pool = followUps[u.effect.type];
  const followUp = pool ? pool[hashStr(u.id + suffix) % pool.length] : "";
  const baseName = u.name.replace(/ (I|II|III)$/, "");
  const cost = Math.round(u.cost * costMult);
  return {
    id: u.id + suffix,
    name: baseName + " " + roman,
    description: followUp ? `${u.baseDescription || u.description} ${followUp}` : u.description,
    baseDescription: u.baseDescription || u.description,
    cost,
    icon: u.icon,
    color: u.color,
    photoUpgradeId: u.rootId || u.id,
    rootId: u.rootId || u.id,
    effect,
    unlock: { type: "upgradeBought", targetId: unlockFrom, minTotalPoints: Math.round(cost * minTotalPointsMult) },
  };
}

function fmtNumber(n) {
  if (n === null || n === undefined || isNaN(n)) return "0";
  const sign = n < 0 ? "-" : "";
  n = Math.abs(n);
  if (n < 1000) {
    return sign + (Number.isInteger(n) ? n.toString() : n.toFixed(1));
  }
  const suffixes = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc"];
  let tier = Math.floor(Math.log10(n) / 3);
  tier = Math.min(tier, suffixes.length - 1);
  const scaled = n / Math.pow(1000, tier);
  const formatted = scaled >= 100 ? scaled.toFixed(0) : scaled >= 10 ? scaled.toFixed(1) : scaled.toFixed(2);
  return sign + formatted + suffixes[tier];
}
function fmtRate(n) { return fmtNumber(n); }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function fmtDuration(ms) {
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const days = Math.floor(totalSec / 86400);
  const hours = Math.floor((totalSec % 86400) / 3600);
  const mins = Math.floor((totalSec % 3600) / 60);
  const secs = totalSec % 60;
  if (days > 0) return `${days}d ${hours}h ${mins}m`;
  if (hours > 0) return `${hours}h ${mins}m`;
  if (mins > 0) return `${mins}m ${secs}s`;
  return `${secs}s`;
}
function fmtPercent(mult) {
  return (mult >= 1 ? "+" : "") + Math.round((mult - 1) * 100) + "%";
}
function fmtDate(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  const pad = (x) => String(x).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function filenameCandidates(base, ext) {

}

function stripDiacritics(str) {
  return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/å/gi, "a").replace(/ä/gi, "a").replace(/ö/gi, "o");
}

function slugify(str) {
  return stripDiacritics(str).toLowerCase().replace(/[^a-z0-9]+/g, "");
}

function upgradePhotoBases(u) {

  const idBase = u.id.replace(/^u_/, "");
  const nameBase = slugify(u.name);
  const auto = [idBase, nameBase].filter((b, i, arr) => b && arr.indexOf(b) === i);
  return [...explicitList, ...auto];
}

async function tryLoadFirstAvailable(baseOrBases, debugKey) {
  const bases = Array.isArray(baseOrBases) ? baseOrBases : [baseOrBases];
  const allBases = [];
  bases.forEach((b) => {
    if (!allBases.includes(b)) allBases.push(b);
    const stripped = stripDiacritics(b);
    if (!allBases.includes(stripped)) allBases.push(stripped);
  });
  const tried = [];
  for (const base of allBases) {
    for (const ext of IMAGE_EXTENSIONS) {
      for (const path of filenameCandidates(base, ext)) {
        tried.push(path);
        const result = await tryLoadLocalImage(path);
        if (result) {
          if (debugKey) imageLoadDebug[debugKey] = { found: result, tried };
          return result;
        }
      }
    }
  }
  console.log(`[Botby Clicker] no local image found for: ${allBases[0]} (fine if you don't have one)`);
  if (debugKey) imageLoadDebug[debugKey] = { found: null, tried };
  return null;
}

  const upgradeChecks = [...manualUpgrades, AMNEN_UPGRADE, ...subjectRootUpgrades].map((u) =>
    tryLoadFirstAvailable(upgradePhotoBases(u), u.id).then((src) => { localAssets.upgrades[u.id] = src; })

  const otherChecks = [

    tryLoadFirstAvailable("background", "background").then((src) => { localAssets.background = src; }),
    tryLoadFirstAvailable("guldmegis", "guldmegis").then((src) => { localAssets.megis = src; }),

}

const upgradeById = Object.fromEntries(allUpgrades.map((u) => [u.id, u]));
const buildingById = Object.fromEntries(buildings.map((b) => [b.id, b]));
const achievementById = Object.fromEntries(achievements.map((a) => [a.id, a]));

function freshState() {
  return {
    points: 0,
    totalPointsEarned: 0,
    totalClicks: 0,
    megisClicked: 0,
    buildingsOwned: {},
    upgradesBought: {},
    achievementsUnlocked: {},
    bonds: 0,

    createdAt: Date.now(),
  };
}

let state = freshState();
let pointsPerSecondCache = 0;

function buildingOwnedCount(id) { return state.buildingsOwned[id] || 0; }

function buildingCost(building) {
  const owned = buildingOwnedCount(building.id);
  return Math.ceil(building.baseCost * Math.pow(1.21, owned));
}

function softenStackedBonus(rawMultiplier) {
  const bonus = rawMultiplier - 1;
  const softCap = 1.5;
  if (bonus <= softCap) return rawMultiplier;
  return 1 + softCap + Math.pow(bonus - softCap, 0.65);
}

function upgradeGlobalProductionMultiplier() {
  let mult = 1;
  Object.keys(state.upgradesBought).forEach((id) => {
    const u = upgradeById[id];
    if (u && u.effect.type === "globalProductionMultiplier") mult *= u.effect.value;
  });
  return softenStackedBonus(mult);
}

function upgradeBuildingMultiplier(buildingId) {
  let mult = 1;
  Object.keys(state.upgradesBought).forEach((id) => {
    const u = upgradeById[id];
    if (u && u.effect.type === "buildingMultiplier" && u.effect.targetId === buildingId) mult *= u.effect.value;
  });
  return mult;
}

function achievementRewardMultiplier(kind) {
  let mult = 1;
  Object.keys(state.achievementsUnlocked).forEach((id) => {
    const a = achievementById[id];
    if (a && a.reward && a.reward.type === kind) mult *= a.reward.value;
  });
  return mult;
}

const GROWTH_RATE_MAX = 0.04;
const GROWTH_RATE_MIN = 0.0015;
const GROWTH_DECAY = 40;

function buildingGrowthMultiplier(building) {
  const owned = buildingOwnedCount(building.id);
  let mult = 1;
  for (let n = 0; n < owned; n++) {
    const rate = GROWTH_RATE_MIN + (GROWTH_RATE_MAX - GROWTH_RATE_MIN) * Math.exp(-n / GROWTH_DECAY);
    mult *= 1 + rate;
  }
  return mult;
}

function buildingPerUnitProduction(building) {
  return building.baseProduction * upgradeBuildingMultiplier(building.id) * buildingGrowthMultiplier(building);
}

function buildingBaseProduction(building) {
  return buildingPerUnitProduction(building) * buildingOwnedCount(building.id);
}

function buildingEffectivePerUnitProduction(building) {
  return (
    buildingPerUnitProduction(building) *
    upgradeGlobalProductionMultiplier() *
    achievementRewardMultiplier("globalProductionMultiplier") *
    (1 + state.bonds * PRESTIGE_BONUS_PER_UNIT) *
    (megisProductionBuffActive() ? MEGIS_PRODUCTION_MULT : 1)
  );
}

function buildingRawProduction(building) {
  return building.baseProduction * buildingGrowthMultiplier(building) * buildingOwnedCount(building.id);
}

function buildingShareOfProductionText(building) {
  const owned = buildings.filter((b) => buildingOwnedCount(b.id) > 0);
  const totalRaw = owned.reduce((sum, b) => sum + buildingRawProduction(b), 0);
  if (totalRaw <= 0) return "0% av total gul wilma produktion";
  const share = (buildingRawProduction(building) / totalRaw) * 100;
  const shareText = share < 0.1 ? "<0.1%" : `${share.toFixed(share < 10 ? 1 : 0)}%`;
  return `${shareText} av total gul wilma produktion`;
}

function computePointsPerSecond() {
  let total = 0;
  buildings.forEach((b) => { total += buildingBaseProduction(b); });
  total *= upgradeGlobalProductionMultiplier();
  total *= achievementRewardMultiplier("globalProductionMultiplier");
  total *= 1 + state.bonds * PRESTIGE_BONUS_PER_UNIT;
  if (megisProductionBuffActive()) total *= MEGIS_PRODUCTION_MULT;
  return total;
}

function computeClickValue() {
  let val = mainClickable.baseClickAmount;
  Object.keys(state.upgradesBought).forEach((id) => {
    const u = upgradeById[id];
    if (!u) return;
    if (u.effect.type === "clickFlatBonus") val += u.effect.value;
  });
  let mult = 1;
  Object.keys(state.upgradesBought).forEach((id) => {
    const u = upgradeById[id];
    if (u && u.effect.type === "clickMultiplier") mult *= u.effect.value;
  });
  mult = softenStackedBonus(mult);
  mult *= achievementRewardMultiplier("clickMultiplier");
  let vaidaBonusPerOwned = VAIDA_CLICK_PER_OWNED;
  Object.keys(state.upgradesBought).forEach((id) => {
    const u = upgradeById[id];
    if (u && u.effect.type === "vaidaClickPerOwned") vaidaBonusPerOwned += u.effect.value;
  });
  mult *= 1 + buildingOwnedCount("b_vaida") * vaidaBonusPerOwned;
  mult *= 1 + state.bonds * PRESTIGE_BONUS_PER_UNIT;
  if (megisClickBuffActive()) mult *= MEGIS_CLICK_MULT;
  return val * mult;
}

function isBuildingUnlocked(building) { return state.totalPointsEarned >= (building.unlockAt || 0); }

function isUpgradeUnlocked(upgrade) {
  const u = upgrade.unlock;
  if (!u || u.type === "none") return true;
  if (u.minTotalPoints && state.totalPointsEarned < u.minTotalPoints) return false;
  if (u.type === "totalPoints") return state.totalPointsEarned >= u.value;
  if (u.type === "clicks") return state.totalClicks >= u.value;
  if (u.type === "buildingOwned") return buildingOwnedCount(u.targetId) >= u.value;
  if (u.type === "upgradeBought") return !!state.upgradesBought[u.targetId];
  return true;
}

function checkAchievementRequirement(req) {
  if (!req) return false;
  switch (req.type) {
    case "totalPoints": return state.totalPointsEarned >= req.value;
    case "clicks": return state.totalClicks >= req.value;
    case "megisClicked": return state.megisClicked >= req.value;
    case "upgradesBought": return Object.keys(state.upgradesBought).length >= req.value;
    case "prestigeCount": return state.prestigeCount >= req.value;
    case "buildingOwned":
      if (req.targetId) return buildingOwnedCount(req.targetId) >= req.value;
      return Object.values(state.buildingsOwned).reduce((a, b) => a + b, 0) >= req.value;
    case "specificUpgrade": return !!state.upgradesBought[req.targetId];
    case "ownAllBuildings": return buildings.every((b) => buildingOwnedCount(b.id) > 0);
    case "playTime": return Date.now() - (state.createdAt || Date.now()) >= req.value;
    default: return false;
  }
}

function addPoints(amount) {
  state.points += amount;
  state.totalPointsEarned += amount;
}

let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

function playClickNoise(ctx, startTime, opts) {
  opts = opts || {};
  const duration = opts.duration || 0.022;
  const filterFreq = opts.filterFreq || 2100;
  const noisePeak = opts.noisePeak || 0.16;
  const thumpFreq = opts.thumpFreq || 160;
  const thumpPeak = opts.thumpPeak || 0.055;
  const thumpDuration = opts.thumpDuration || 0.03;

  const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * duration));
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
  }
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.value = filterFreq;
  filter.Q.value = 0.7;
  const noiseGain = ctx.createGain();
  noiseGain.gain.setValueAtTime(noisePeak, startTime);
  noiseGain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
  noise.connect(filter);
  filter.connect(noiseGain);
  noiseGain.connect(ctx.destination);
  noise.start(startTime);
  noise.stop(startTime + duration + 0.01);

  const thump = ctx.createOscillator();
  const thumpGain = ctx.createGain();
  thump.type = "sine";
  thump.frequency.setValueAtTime(thumpFreq, startTime);
  thumpGain.gain.setValueAtTime(0.0001, startTime);
  thumpGain.gain.exponentialRampToValueAtTime(thumpPeak, startTime + 0.002);
  thumpGain.gain.exponentialRampToValueAtTime(0.0001, startTime + thumpDuration);
  thump.connect(thumpGain);
  thumpGain.connect(ctx.destination);
  thump.start(startTime);
  thump.stop(startTime + thumpDuration + 0.005);
}

function playClickSound() {
  if (isMuted) return;
  try {
    const ctx = getAudioCtx();
    playClickNoise(ctx, ctx.currentTime, {
      duration: 0.022, filterFreq: 2100, noisePeak: 0.16,
      thumpFreq: 160, thumpPeak: 0.055, thumpDuration: 0.03,
    });
  } catch (e) { }
}

function doClick() {
  const val = computeClickValue();
  addPoints(val);
  state.totalClicks += 1;
  spawnFloatingNumber(val);

  checkAchievements();

function buyBuilding(id) {
  const b = buildingById[id];
  if (!b) return;
  const cost = buildingCost(b);
  if (state.points < cost) return;
  state.points -= cost;
  state.buildingsOwned[id] = buildingOwnedCount(id) + 1;
  playHireSound();
  checkAchievements();
  renderAll();
}

function buyUpgrade(id) {
  const u = upgradeById[id];
  if (!u || state.upgradesBought[id]) return;
  if (state.points < u.cost) return;
  state.points -= u.cost;
  state.upgradesBought[id] = true;
  playPopSound();
  checkAchievements();
  renderAll();
}

function checkAchievements() {
  let newlyUnlocked = null;
  achievements.forEach((a) => {
    if (state.achievementsUnlocked[a.id]) return;
    if (checkAchievementRequirement(a.requirement)) {
      state.achievementsUnlocked[a.id] = true;
      newlyUnlocked = a;
    }
  });
  if (newlyUnlocked) showAchievementToast(newlyUnlocked);
}

const PRESTIGE_THRESHOLD = 1000000000000;
const PRESTIGE_BONUS_PER_UNIT = 0.01;

function bondsAvailableOnReset() {
  return Math.floor(Math.cbrt(Math.max(0, state.totalPointsEarned) / PRESTIGE_THRESHOLD));
}

function pointsNeededForNextBond() {
  const currentGain = bondsAvailableOnReset();
  const nextThreshold = Math.pow(currentGain + 1, 3) * PRESTIGE_THRESHOLD;
  return Math.max(0, nextThreshold - state.totalPointsEarned);
}

function doPrestige() {
  const gained = bondsAvailableOnReset();
  if (gained < 1) return;
  const newBonds = state.bonds + gained;
  const newPrestigeCount = state.prestigeCount + 1;
  const keptAchievements = state.achievementsUnlocked;
  state = freshState();
  state.bonds = newBonds;
  state.prestigeCount = newPrestigeCount;
  state.achievementsUnlocked = keptAchievements;
  saveGame();
  renderAll();
}

function saveGame() {
  state.lastSaveTime = Date.now();
  try {
    localStorage.setItem(GAME_SETTINGS.saveKey, JSON.stringify(state));
  } catch (e) {
    console.warn("Save failed", e);
  }
}

function loadGame() {
  let raw;
  try { raw = localStorage.getItem(GAME_SETTINGS.saveKey); } catch (e) { raw = null; }
  if (!raw) return;
  try {
    const loaded = JSON.parse(raw);
    state = Object.assign(freshState(), loaded);
    state.buildingsOwned = loaded.buildingsOwned || {};
    state.upgradesBought = loaded.upgradesBought || {};
    state.achievementsUnlocked = loaded.achievementsUnlocked || {};
  } catch (e) {
    console.warn("Save file was corrupt, starting fresh.", e);
    state = freshState();
  }
}

let toastQueue = [];

function drainToastQueue() {
  if (toastQueue.length === 0) { toastShowing = false; return; }
  toastShowing = true;
  const a = toastQueue.shift();
  const toast = document.getElementById("achievementToast");

    setTimeout(() => { toast.classList.add("hidden"); drainToastQueue(); }, 350);

}

const MEGIS_BASE_INTERVAL_MS = 7 * 60 * 1000;
const MEGIS_BASE_DURATION_MS = 90 * 1000;
const MEGIS_PRODUCTION_MULT = 5;
const MEGIS_CLICK_MULT = 8;
const MEGIS_EFFECTS = ["production", "click", "lucky"];
const MEGIS_APPEAR_DURATION_MS = 1400;
const MEGIS_IDLE_BEFORE_DESPAWN_MS = 2500;
const MEGIS_DESPAWN_DURATION_MS = 6000;

let megisEl = null;
let megisBuffType = null;
let megisBuffEndAt = 0;
let megisSpawnRemainingMs = MEGIS_BASE_INTERVAL_MS;

function megisSpawnRateMultiplier() {
  let mult = 1;
  Object.keys(state.upgradesBought).forEach((id) => {
    const u = upgradeById[id];
    if (u && u.effect.type === "megisSpawnRateMultiplier") mult *= u.effect.value;
  });
  return mult;
}
function megisDurationMultiplier() {
  let mult = 1;
  Object.keys(state.upgradesBought).forEach((id) => {
    const u = upgradeById[id];
    if (u && u.effect.type === "megisDurationMultiplier") mult *= u.effect.value;
  });
  return mult;
}
function megisProductionBuffActive() {
  return megisBuffType === "production" && Date.now() < megisBuffEndAt;
}
function megisClickBuffActive() {
  return megisBuffType === "click" && Date.now() < megisBuffEndAt;
}

function updateMegisTimer() {
  const el = document.getElementById("megisTimer");
  if (!el) return;
  const active = megisProductionBuffActive() || megisClickBuffActive();
  if (!active) {
    el.classList.add("hidden");
    return;
  }
  const remainingMs = Math.max(0, megisBuffEndAt - Date.now());
  const label = megisBuffType === "production"
    ? `${MEGIS_PRODUCTION_MULT}x Produktion`
    : `${MEGIS_CLICK_MULT}x Clicks`;
  el.textContent = `${label} · ${fmtDuration(remainingMs)} kvar`;
  el.classList.remove("hidden");
}

function scheduleMegisSpawn() {
  megisSpawnRemainingMs = MEGIS_BASE_INTERVAL_MS / megisSpawnRateMultiplier();
}

function advanceMegisSpawnTimer(dtMs) {
  if (megisEl || dtMs <= 0) return;
  megisSpawnRemainingMs -= dtMs;
  if (megisSpawnRemainingMs <= 0) spawnMegis();
}

function spawnMegis(force) {
  if (megisEl) {
    if (!force) { scheduleMegisSpawn(); return; }
    clearTimeout(megisEl._despawnStartTimeout);
    clearTimeout(megisEl._despawnRemoveTimeout);
    megisEl.remove();
    megisEl = null;
  }
  const stage = document.querySelector(".click-stage");
  if (!stage) { scheduleMegisSpawn(); return; }
  const btn = document.createElement("button");
  btn.className = "megis-cookie";
  btn.title = "Guld Megis";
  btn.style.left = (15 + Math.random() * 70) + "%";
  btn.style.top = (14 + Math.random() * 64) + "%";
  const photoSrc = localAssets.megis;
  if (photoSrc) {
    const img = document.createElement("img");
    img.src = photoSrc;
    img.alt = "Guld Megis";
    btn.appendChild(img);
  } else {
    btn.appendChild(renderIcon("star", ICON_COLORS.gold));
  }
  btn.addEventListener("click", claimMegis);
  stage.appendChild(btn);
  megisEl = btn;
  btn._despawnStartTimeout = setTimeout(
    () => startMegisDespawn(btn),
    MEGIS_APPEAR_DURATION_MS + MEGIS_IDLE_BEFORE_DESPAWN_MS
  );
}

function startMegisDespawn(btn) {
  if (megisEl !== btn) return;
  btn.classList.add("despawning");
  btn._despawnRemoveTimeout = setTimeout(() => {
    if (megisEl === btn) {
      megisEl = null;
      btn.remove();
      scheduleMegisSpawn();
    }
  }, MEGIS_DESPAWN_DURATION_MS);
}

function claimMegis() {
  if (!megisEl) return;
  const el = megisEl;
  megisEl = null;
  clearTimeout(el._despawnStartTimeout);
  clearTimeout(el._despawnRemoveTimeout);
  el.classList.remove("despawning");
  const leftStyle = el.style.left;
  const topStyle = el.style.top;
  state.megisClicked += 1;

  const effect = MEGIS_EFFECTS[Math.floor(Math.random() * MEGIS_EFFECTS.length)];
  const pps = computePointsPerSecond();
  const durationMs = MEGIS_BASE_DURATION_MS * megisDurationMultiplier();
  let reward = 0;
  let floatLabel = "";

  if (effect === "production") {
    reward = pps * (10 + Math.random() * 10);
    megisBuffType = "production";
    megisBuffEndAt = Date.now() + durationMs;
    floatLabel = `${MEGIS_PRODUCTION_MULT}x Produktion!`;
    flashMegisGlow(durationMs);
  } else if (effect === "click") {
    reward = pps * (10 + Math.random() * 10);
    megisBuffType = "click";
    megisBuffEndAt = Date.now() + durationMs;
    floatLabel = `${MEGIS_CLICK_MULT}x Clicks!`;
    flashMegisGlow(durationMs);
  } else {
    reward = pps * (40 + Math.random() * 40);
    megisBuffType = null;
    megisBuffEndAt = 0;
    floatLabel = `+${fmtNumber(reward)}!`;
  }
  if (reward > 0) addPoints(reward);

  el.classList.add("claimed");
  setTimeout(() => el.remove(), 1000);

  playMegisSound();
  spawnMegisEffectText(leftStyle, topStyle, floatLabel);

  scheduleMegisSpawn();
  renderTopStats();
}

function flashMegisGlow(durationMs) {
  const overlay = document.getElementById("megisGlowOverlay");
  if (!overlay) return;
  overlay.classList.add("show");
  clearTimeout(overlay._timeout);
  overlay._timeout = setTimeout(() => overlay.classList.remove("show"), durationMs);
}

function spawnMegisEffectText(leftStyle, topStyle, text) {
  const stage = document.querySelector(".click-stage");
  if (!stage) return;
  const el = document.createElement("div");
  el.className = "megis-effect-text";
  el.textContent = text;
  el.style.left = leftStyle;
  el.style.top = topStyle;
  stage.appendChild(el);

}

function formatEffectTooltip(effect) {
  if (!effect) return "";
  switch (effect.type) {
    case "clickMultiplier":
      return `+${Math.round((effect.value - 1) * 100)}% mera Gul Wilma per click`;
    case "clickFlatBonus":
      return `+${fmtNumber(effect.value)} mera Gul Wilma per click`;
    case "globalProductionMultiplier":
      return `+${Math.round((effect.value - 1) * 100)}% mera Gul Wilma`;
    case "buildingMultiplier": {
      const target = buildingById[effect.targetId];
      const name = target ? target.name : "Personalen";
      return `${name} blir ${Math.round((effect.value - 1) * 100)}% mera effektiv`;
    }
    case "megisSpawnRateMultiplier":
      return `Guld Megis dyker upp ${effect.value}x oftare`;
    case "vaidaClickPerOwned":
      return `+${(effect.value * 100).toFixed(1)}% Gul Wilma per click, per Vaida`;
    case "megisDurationMultiplier":
      return `Guld Megis-effekten varar ${effect.value}x längre`;
    default:
      return "Låser upp nya uppgraderingar";
  }
}

function buildingHoverTooltip(b) {
  const perUnit = buildingEffectivePerUnitProduction(b);
  const owned = buildingOwnedCount(b.id);
  const total = perUnit * owned;
  return `+${fmtRate(perUnit)}/s Gul Wilma styck\nTotalt: +${fmtRate(total)}/s Gul Wilma (${fmtNumber(owned)} st)\n${buildingShareOfProductionText(b)}`;
}

let customTooltipEl = null;
function getCustomTooltip() {
  if (!customTooltipEl) {
    customTooltipEl = document.createElement("div");
    customTooltipEl.id = "customTooltip";
    document.body.appendChild(customTooltipEl);
  }
  return customTooltipEl;
}
function showTooltip(target) {
  const text = target.dataset.tooltip;
  if (!text) return;
  const tip = getCustomTooltip();
  tip.textContent = text;
  tip.classList.add("show");
  positionTooltip(target);
}
function positionTooltip(target) {
  const tip = getCustomTooltip();
  if (!tip.classList.contains("show")) return;
  const rect = target.getBoundingClientRect();
  const tipRect = tip.getBoundingClientRect();
  const gap = 14;
  let left = rect.left - tipRect.width - gap;
  if (left < 8) left = rect.right + gap;
  left = Math.min(left, window.innerWidth - tipRect.width - 8);
  let top = rect.top + rect.height / 2 - tipRect.height / 2;
  top = Math.max(8, Math.min(top, window.innerHeight - tipRect.height - 8));
  tip.style.left = left + "px";
  tip.style.top = top + "px";
}
function hideTooltip() {
  if (customTooltipEl) customTooltipEl.classList.remove("show");
}
function attachTooltip(el) {
  el.addEventListener("mouseenter", () => showTooltip(el));
  el.addEventListener("mouseleave", hideTooltip);
}

function renderBuildings() {
  const list = document.getElementById("buildingList");
  list.innerHTML = "";
  const unlocked = buildings.filter(isBuildingUnlocked);
  if (unlocked.length === 0) {
    list.innerHTML = `<p class="item-desc">Tjäna lite ${GAME_SETTINGS.currencyNamePlural} för att anställa din första i personalen.</p>`;
    return;
  }
  unlocked.forEach((b) => {
    const owned = buildingOwnedCount(b.id);
    const cost = buildingCost(b);
    const affordable = state.points >= cost;

    const btn = document.createElement("button");
    btn.className = "item-card staff";
    btn.dataset.id = b.id;
    btn.disabled = !affordable;
    btn.dataset.tooltip = buildingHoverTooltip(b);
    attachTooltip(btn);
    btn.appendChild(buildStaffThumb(b));

    const body = document.createElement("div");
    body.className = "item-body";
    body.innerHTML = `
      <p class="item-name hand">${escapeHtml(b.name)}</p>
      <p class="item-meta">${fmtNumber(cost)} ${GAME_SETTINGS.currencyAbbrev} · +${fmtRate(buildingEffectivePerUnitProduction(b))}/s styck</p>
    `;
    btn.appendChild(body);

    const badge = document.createElement("span");
    badge.className = "item-count-badge";
    badge.textContent = owned;
    btn.appendChild(badge);

    btn.addEventListener("click", () => buyBuilding(b.id));
    list.appendChild(btn);
  });
}

const MAX_VISIBLE_UPGRADES = 12;
function getVisibleUpgrades() {
  return allUpgrades
    .filter((u) => !state.upgradesBought[u.id] && isUpgradeUnlocked(u))
    .sort((a, b) => a.cost - b.cost)
    .slice(0, MAX_VISIBLE_UPGRADES);
}

function renderUpgrades() {
  const list = document.getElementById("upgradeList");
  list.innerHTML = "";
  const visible = getVisibleUpgrades();
  if (visible.length === 0) {
    list.innerHTML = `<p class="item-desc">Inga uppgraderingar tillgängliga än.</p>`;
    return;
  }
  visible.forEach((u) => {
    const affordable = state.points >= u.cost;
    const card = document.createElement("div");
    card.className = "item-card compact" + (affordable ? "" : " disabled-card");
    card.dataset.id = u.id;
    card.setAttribute("role", "button");
    card.setAttribute("tabindex", "0");
    card.dataset.tooltip = formatEffectTooltip(u.effect);
    attachTooltip(card);
    card.appendChild(buildUpgradeThumb(u));

    const body = document.createElement("div");
    body.className = "item-body";
    body.innerHTML = `
      <p class="item-name hand">${escapeHtml(u.name)}</p>
      <p class="item-meta">${fmtNumber(u.cost)} ${GAME_SETTINGS.currencyAbbrev}</p>
    `;
    card.appendChild(body);

    const activate = () => { if (state.points >= u.cost) buyUpgrade(u.id); };
    card.addEventListener("click", activate);
    card.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(); }
    });
    list.appendChild(card);
  });
}

function refreshBuildingCards() {
  const list = document.getElementById("buildingList");
  const unlocked = buildings.filter(isBuildingUnlocked);
  const currentIds = Array.from(list.children).map((el) => el.dataset.id);
  const targetIds = unlocked.map((b) => b.id);
  if (currentIds.length !== targetIds.length || currentIds.some((id, i) => id !== targetIds[i])) {
    renderBuildings();
    return;
  }
  unlocked.forEach((b) => {
    const btn = list.querySelector(`[data-id="${b.id}"]`);
    if (!btn) return;
    const cost = buildingCost(b);
    const affordable = state.points >= cost;
    btn.disabled = !affordable;
    btn.dataset.tooltip = buildingHoverTooltip(b);
    const meta = btn.querySelector(".item-meta");
    if (meta) meta.textContent = `${fmtNumber(cost)} ${GAME_SETTINGS.currencyAbbrev} · +${fmtRate(buildingEffectivePerUnitProduction(b))}/s styck`;
    const badge = btn.querySelector(".item-count-badge");
    if (badge) badge.textContent = buildingOwnedCount(b.id);
  });
}

function refreshUpgradeCards() {
  const list = document.getElementById("upgradeList");
  const visible = getVisibleUpgrades();
  const currentIds = Array.from(list.children).map((el) => el.dataset.id);
  const targetIds = visible.map((u) => u.id);
  if (currentIds.length !== targetIds.length || currentIds.some((id, i) => id !== targetIds[i])) {
    renderUpgrades();
    return;
  }
  visible.forEach((u) => {
    const card = list.querySelector(`[data-id="${u.id}"]`);
    if (!card) return;
    const affordable = state.points >= u.cost;
    card.classList.toggle("disabled-card", !affordable);
    card.dataset.tooltip = formatEffectTooltip(u.effect);
  });
}

function renderAchievements() {

  document.getElementById("achievementsProgress").textContent = `Betyg (${unlockedCount} / ${achievements.length})`;

function renderStaffShareSection() {
  const owned = buildings.filter((b) => buildingOwnedCount(b.id) > 0);
  const totalRaw = owned.reduce((sum, b) => sum + buildingRawProduction(b), 0);
  if (owned.length === 0 || totalRaw <= 0) {
    return `<div class="stats-subhead">Personalens andel av total Gul Wilma-produktion</div><p class="item-desc">Ingen personal anställd än.</p>`;
  }
  const rows = owned
    .slice()
    .sort((a, b) => buildingRawProduction(b) - buildingRawProduction(a))
    .map((b) => {
      const share = (buildingRawProduction(b) / totalRaw) * 100;
      const shareText = share < 0.1 ? "<0.1% av total gul wilma produktion" : `${share.toFixed(share < 10 ? 1 : 0)}% av total gul wilma produktion`;
      return `<div class="staff-stat-row"><span class="ssr-name">${escapeHtml(b.name)}</span><span class="ssr-owned">${fmtNumber(buildingOwnedCount(b.id))} st</span><span class="ssr-rate">${shareText}</span></div>`;
    })
    .join("");
  return `<div class="stats-subhead">Personalens andel av total Gul Wilma-produktion (utan uppgraderingar)</div>${rows}`;
}

function renderStats() {
  const panel = document.getElementById("statsPanel");
  const now = Date.now();
  const runMs = now - (state.createdAt || now);
  const mostOwnedBuilding = buildings.reduce((best, b) => {
    const owned = buildingOwnedCount(b.id);
    return (!best || owned > best.owned) ? { name: b.name, owned } : best;
  }, null);

  const rows = [
    ["Läsåret startade", fmtDate(state.createdAt)],
    ["Tid spelad", fmtDuration(runMs)],
    ["Gul Wilma totalt", fmtNumber(state.totalPointsEarned)],
    ["Gul Wilma just nu", fmtNumber(state.points)],
    ["Antal clicks", fmtNumber(state.totalClicks)],
    ["Guld Megis klickade", fmtNumber(state.megisClicked)],
    ["Personal", fmtNumber(Object.values(state.buildingsOwned).reduce((a,b)=>a+b,0))],
    ["Mest anställda", mostOwnedBuilding && mostOwnedBuilding.owned > 0 ? `${mostOwnedBuilding.name} (${fmtNumber(mostOwnedBuilding.owned)})` : "—"],
    ["Uppgraderingar köpta", `${fmtNumber(Object.keys(state.upgradesBought).length)} / ${allUpgrades.length}`],
    ["Betyg", `${Object.keys(state.achievementsUnlocked).length} / ${achievements.length}`],
    [GAME_SETTINGS.prestigeCurrencyName, fmtNumber(state.bonds)],
    ["Nya läsår", fmtNumber(state.prestigeCount)],
    ["Senast sparat", fmtDate(state.lastSaveTime)],
  ];
  panel.innerHTML = rows.map(([label, val]) =>
    `<div class="stats-row"><span>${label}</span><span>${val}</span></div>`
  ).join("") + renderStaffShareSection();

  const gain = bondsAvailableOnReset();
  const remaining = pointsNeededForNextBond();
  document.getElementById("prestigeInfo").textContent =
    gain > 0
      ? `Starta ett nytt läsår nu för ${gain} ${GAME_SETTINGS.prestigeCurrencyName}. Varje ger +1% på all Gul Wilma, permanent. ${fmtNumber(remaining)} ${GAME_SETTINGS.currencyAbbrev} till nästa.`
      : `${fmtNumber(remaining)} ${GAME_SETTINGS.currencyAbbrev} kvar innan du kan starta ett nytt läsår. Varje ${GAME_SETTINGS.prestigeCurrencyName} ger +2% på all Gul Wilma, permanent.`;
  document.getElementById("btnPrestige").disabled = gain < 1;

  const currentThreshold = Math.pow(gain, 3) * PRESTIGE_THRESHOLD;
  const nextThreshold = Math.pow(gain + 1, 3) * PRESTIGE_THRESHOLD;
  const span = nextThreshold - currentThreshold;
  const progressFraction = span > 0
    ? clamp((state.totalPointsEarned - currentThreshold) / span, 0, 1)
    : 1;
  document.getElementById("prestigeProgressFill").style.width = `${(progressFraction * 100).toFixed(1)}%`;
  document.getElementById("prestigeProgressLabel").textContent = `${Math.floor(progressFraction * 100)}%`;

  renderImageDebugPanel();
}

const SHOW_IMAGE_DEBUG = new URLSearchParams(location.search).has("imgdebug");
function renderImageDebugPanel() {
  if (!SHOW_IMAGE_DEBUG) return;
  let box = document.getElementById("imageDebugBox");
  if (!box) {
    box = document.createElement("div");
    box.id = "imageDebugBox";
    box.style.marginTop = "0.9rem";
    box.style.padding = "0.7rem 0.8rem";
    box.style.border = "1px dashed var(--line)";
    box.style.borderRadius = "0.6rem";
    box.style.fontSize = "0.72rem";
    box.style.lineHeight = "1.5";
    const dangerBox = document.querySelector("#panel-stats .danger-box");
    dangerBox.parentElement.insertBefore(box, dangerBox.nextSibling);
  }

  const entries = [
    ...buildings.map((b) => [b.id, b.name]),
    ...manualUpgrades.map((u) => [u.id, u.name]),
    [AMNEN_UPGRADE.id, AMNEN_UPGRADE.name],
    ...subjectRootUpgrades.map((u) => [u.id, u.name]),
    ["clickerbutton", "Clickknappen"],
    ["background", "Bakgrund"],
    ["guldmegis", "Guld Megis (bild)"],
  ];

  const rows = entries.map(([key, label]) => {
    const d = imageLoadDebug[key];
    if (!d) return `<div><b>${escapeHtml(label)}</b>: väntar…</div>`;
    if (d.found) {
      return `<div><b>${escapeHtml(label)}</b>: ✅ hittad (<code>${escapeHtml(d.found)}</code>)</div>`;
    }
    const firstFew = d.tried.slice(0, 4).map((p) => `<code>${escapeHtml(p)}</code>`).join(", ");
    const more = d.tried.length > 4 ? ` … (+${d.tried.length - 4} till)` : "";
    return `<div><b>${escapeHtml(label)}</b>: ❌ ingen bild hittad. Provade t.ex. ${firstFew}${more}</div>`;
  });

  box.innerHTML =
    `<div style="font-family:var(--font-display);font-weight:700;color:var(--gold-dim);margin-bottom:0.3rem;">Bildfelsökning</div>` +
    `<div style="opacity:0.8;margin-bottom:0.4rem;">Lägg bildfilen i SAMMA mapp som HTML-filen, med exakt något av namnen nedan (skiftläge/ändelse spelar mindre roll).</div>` +
    rows.join("");
}

function escapeHtml(str) {
  if (!str) return "";
  return str.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function doFullRestart() {
  try {
    localStorage.removeItem(GAME_SETTINGS.saveKey);
  } catch (e) {

let lastTickAt = Date.now();
const MAX_TICK_GAP_MS = 30 * 1000;
let backgroundSince = null;
const AFK_LIMIT_MS = 5 * 60 * 1000;
function tick() {
  const now = Date.now();
  let dtSec = Math.min(now - lastTickAt, MAX_TICK_GAP_MS) / 1000;
  if (document.hidden && backgroundSince !== null && now - backgroundSince > AFK_LIMIT_MS) {
    dtSec = 0;
  }
  lastTickAt = now;
  const pps = computePointsPerSecond();
  if (pps > 0 && dtSec > 0) addPoints(pps * dtSec);
  advanceMegisSpawnTimer(dtSec * 1000);
  checkAchievements();
  renderTopStats();
  updateMegisTimer();
}

async function init() {
  loadGame();
  setupTabs();
  setupTooltipDismissal();
  setupClickHandler();
  setupPrestige();
  setupRestart();
  setupDarkMode();
  setupMute();
  await preloadLocalAssets();
  applyBackgroundPhoto();
  renderAll();

  lastTickAt = Date.now();
  setInterval(tick, GAME_SETTINGS.tickIntervalMs);
  setInterval(() => { refreshBuildingCards(); refreshUpgradeCards(); renderStats(); }, 1000);
  setInterval(saveGame, GAME_SETTINGS.autosaveIntervalSec * 1000);
  window.addEventListener("beforeunload", saveGame);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      backgroundSince = Date.now();
      saveGame();
    } else {
      backgroundSince = null;
      lastTickAt = Date.now();
      tick();
    }
  });

  scheduleMegisSpawn();
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
